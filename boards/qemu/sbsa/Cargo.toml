[package]
name = "fstart-board-qemu-sbsa"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "qemu-sbsa"
name = "SBSA reference"
arch = "aarch64"
build-profile = { dependency = "fstart-platform-qemu" }

[dependencies]
fstart-platform-qemu = { workspace = true, default-features = false }
fstart-driver-uart = { workspace = true }

# One binary per stage, named after the stage: src/bin/stage.rs.

[lints]
workspace = true

[package]
name = "fstart-board-amd-onyx"
description = "AMD Onyx: AMD SP5 1P reference board, EPYC 9004 (Genoa)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A whole 16 MiB native image packed from blobs (`--blobs`, AMD's public
# Genoa blobs and the board's APCBs, or `--donor`); see README.md.
[package.metadata.fstart]
board = "amd-onyx"
name = "Onyx"
arch = "x86_64"
build-profile = { dependency = "fstart-platform-amd" }

# The board's APCBs, as its firmware image has them; Genoa's files are in
# fstart-platform-amd's table.
[package.metadata.fstart.amd]
soc = "genoa"
apcb = { entries = [
  { type = 0x60, file = "onyx/apcb-60-0.bin" },
  { type = 0x60, instance = 1, file = "onyx/apcb-60-1.bin" },
  { type = 0x68, file = "onyx/apcb-68-0.bin" },
  { type = 0x68, instance = 8, file = "onyx/apcb-68-8.bin" },
  { type = 0x68, instance = 9, file = "onyx/apcb-68-9.bin" },
] }

[features]
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-amd/smm"]

# Versions are spelled out instead of inherited: boards are outside the
# workspace (fbuild adds them to a generated one) and this crate also
# builds on its own.
[dependencies]
fstart-platform-amd = { path = "../../../crates/platform-amd" }
fstart-driver-amd = { path = "../../../crates/driver-amd" }
fstart-driver-ipmi = { path = "../../../crates/driver-ipmi" }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-driver-uart = { path = "../../../crates/driver-uart" }
fstart-log = { path = "../../../crates/log" }
heapless = { version = "0.8", default-features = false }
tock-registers = "0.10"

[dev-dependencies]
fstart-driver-amd = { path = "../../../crates/driver-amd", features = ["testing"] }

# The only stage, which the PSP copies to DRAM; fbuild builds it with
# fstart-platform-amd/bundle. Board unit tests (`cargo test`) only
# build the library.
[[bin]]
name = "stage"
path = "src/bin/stage.rs"
test = false
bench = false

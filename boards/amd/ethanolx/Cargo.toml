[package]
name = "fstart-board-amd-ethanolx"
description = "AMD Ethanol-X: experimental dual-socket SP3 Milan port"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "amd-ethanolx"
platform = "x86_64"
target = "x86_64-unknown-none"
stage-bin = "fstart-stage"
build-profile = { dependency = "fstart-platform-sp3", name = "rust" }

[dependencies]
fstart-platform-sp3 = { path = "../../../crates/platform-sp3", features = ["acpi", "milan"] }
fstart-driver-amd = { path = "../../../crates/driver-amd", features = ["milan"] }
fstart-core = { path = "../../../crates/core" }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-driver-ipmi = { path = "../../../crates/driver-ipmi" }
fstart-driver-uart = { path = "../../../crates/driver-uart", features = ["pio"] }
fstart-driver-i2c = { path = "../../../crates/driver-i2c" }
fstart-driver-redriver = { path = "../../../crates/driver-redriver" }
fstart-log = { path = "../../../crates/log" }
embedded-hal = { version = "1", default-features = false }
ufmt = "0.2"
pca9535 = { version = "2", default-features = false }
eeprom24x = "0.7.2"
xca9548a = "1"
heapless = { version = "0.8", default-features = false }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fstart_stage_env, values("monolithic", "smm"))'] }

[[bin]]
name = "fstart-stage"
path = "src/main.rs"
test = false
bench = false

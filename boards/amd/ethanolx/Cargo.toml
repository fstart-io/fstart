[package]
name = "fstart-board-amd-ethanolx"
description = "AMD Ethanol-X: experimental dual-socket SP3 Milan port"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "amd-ethanolx"
platform = "x86_64"
target = "x86_64-unknown-none"
build-profile = { dependency = "fstart-platform-sp3", name = "rust" }

# The board's APCBs of each generation, as its vendor image has them.
[package.metadata.fstart.amd.milan]
# The vendor firmware has the APOB at 64 MiB.
apob-destination = 0x4000000
apcb = { entries = [
  { type = 0x68, subprogram = 1, file = "ethanolx/milan/apcb-68-0.bin" },
  { type = 0x68, subprogram = 1, instance = 8, level = 2, file = "ethanolx/milan/apcb-68-8.bin" },
  { type = 0x68, subprogram = 1, instance = 9, level = 2, file = "ethanolx/milan/apcb-68-9.bin" },
  { type = 0x60, subprogram = 1, level = 2, file = "ethanolx/milan/apcb-60-0.bin" },
  { type = 0x60, subprogram = 1, instance = 1, level = 2, file = "ethanolx/milan/apcb-60-1.bin" },
] }

[features]
default = []
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-sp3/smm"]

[dependencies]
fstart-platform-sp3 = { path = "../../../crates/platform-sp3", features = ["acpi", "milan"] }
fstart-driver-amd = { path = "../../../crates/driver-amd", features = ["milan"] }
fstart-core = { path = "../../../crates/core" }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-driver-ipmi = { path = "../../../crates/driver-ipmi", features = ["acpi"] }
fstart-driver-uart = { path = "../../../crates/driver-uart", features = ["pio"] }
fstart-driver-i2c = { path = "../../../crates/driver-i2c" }
fstart-driver-redriver = { path = "../../../crates/driver-redriver" }
fstart-log = { path = "../../../crates/log" }
embedded-hal = { version = "1", default-features = false }
ufmt = "0.2"
pca9535 = { version = "2", default-features = false }
eeprom24x = "0.7.2"
xca9548a = "1"
heapless = { version = "0.8", default-features = false }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }

# One binary per stage, named after the stage: the reset image.
[[bin]]
name = "reset"
path = "src/bin/reset.rs"
test = false
bench = false

[package]
name = "fstart-board-orangepi-pc2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "orangepi-pc2"
platform = "aarch64"
target = "aarch64-unknown-none"
build-profile = { dependency = "fstart-platform-sunxi", name = "rust" }

[dependencies]
fstart-core = { path = "../../../crates/core" }
fstart-driver-sunxi = { path = "../../../crates/driver-sunxi" }
fstart-platform-sunxi = { path = "../../../crates/platform-sunxi" }
fstart-driver-uart = { path = "../../../crates/driver-uart" }
fstart-log = { path = "../../../crates/log" }

# One binary per stage, named after the stage: src/bin/<stage>.rs.

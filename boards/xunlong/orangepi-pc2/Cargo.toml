[package]
name = "fstart-board-orangepi-pc2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "orangepi-pc2"
name = "Orange Pi PC2"
arch = "aarch64"
build-profile = { dependency = "fstart-platform-sunxi" }

[dependencies]
fstart-core = { workspace = true }
fstart-driver-sunxi = { workspace = true }
fstart-platform-sunxi = { workspace = true }
fstart-driver-uart = { workspace = true }
fstart-log = { workspace = true }

# One binary per stage, named after the stage: src/bin/<stage>.rs.

[lints]
workspace = true

[package]
name = "fstart-board-lenovo-x60"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "lenovo-x60"
platform = "x86"
target = "i686-unknown-none"
build-profile = { dependency = "fstart-platform-intel", name = "rust" }

[dependencies]
fstart-core = { path = "../../../crates/core", features = ["pci"] }
fstart-platform-intel = { path = "../../../crates/platform-intel" }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"], optional = true }
fstart-arch = { path = "../../../crates/arch", features = ["x86_64"] }
fstart-driver-intel = { path = "../../../crates/driver-intel" }
fstart-pci = { path = "../../../crates/pci" }
tock-registers = { workspace = true }
embedded-hal = { workspace = true }
fstart-driver-lenovo = { path = "../../../crates/driver-lenovo" }
fstart-driver-superio = { workspace = true }
fstart-options = { path = "../../../crates/options" }
fstart-driver-ricoh = { path = "../../../crates/driver-ricoh" }
fstart-driver-uart = { path = "../../../crates/driver-uart", features = ["pio"] }
fstart-log = { path = "../../../crates/log" }
# Required at the crate root wherever fstart_log macros expand
# (ufmt's macros emit `ufmt::` paths; see fstart-log docs).
ufmt = { workspace = true }

[features]
# Host tests and tools see the whole board. fbuild builds every stage with
# --no-default-features and adds `acpi` to the ramstage only.
default = ["acpi"]
# The ACPI and SMBIOS tables (`src/acpi.rs`), which need the ramstage heap.
acpi = ["dep:fstart-acpi", "fstart-driver-lenovo/acpi"]
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-intel/bundle-smm"]

# One binary per stage, named after the stage: src/bin/<stage>.rs.

[package]
name = "fstart-board-lenovo-t60"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "lenovo-t60"
platform = "x86"
target = "i686-unknown-none"
build-profile = { dependency = "fstart-platform-intel", name = "rust" }

[package.metadata.fstart.variants.lenovo-r60]
features = ["r60"]
[package.metadata.fstart.variants.lenovo-z61t]
features = ["z61t"]
[features]
default = []
r60 = []
z61t = []
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-intel/bundle-smm"]

[dependencies]
fstart-core = { path = "../../../crates/core", features = ["pci"] }
fstart-platform-intel = { path = "../../../crates/platform-intel", features = ["i945-ich7"] }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-arch = { path = "../../../crates/arch", features = ["x86_64"] }
fstart-driver-intel = { path = "../../../crates/driver-intel" }
fstart-pci = { path = "../../../crates/pci" }
embedded-hal = { workspace = true }
fstart-driver-superio = { path = "../../../crates/driver-superio" }
fstart-intel-gma = { path = "../../../crates/intel-gma", default-features = false }
fstart-driver-lenovo = { path = "../../../crates/driver-lenovo", features = ["acpi"] }
fstart-driver-uart = { path = "../../../crates/driver-uart", features = ["pio"] }
fstart-log = { path = "../../../crates/log" }
ufmt = { workspace = true }

# One binary per stage, named after the stage: src/bin/<stage>.rs.

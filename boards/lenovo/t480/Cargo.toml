[package]
name = "fstart-board-lenovo-t480"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "lenovo-t480"
name = "ThinkPad T480"
arch = "x86_64"
build-profile = { dependency = "fstart-platform-intel" }

[dependencies]
fstart-core = { workspace = true, features = ["pci"] }
fstart-platform-intel = { workspace = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-acpi-macros = { workspace = true, optional = true }
fstart-arch = { workspace = true, features = ["x86_64"] }
fstart-driver-intel = { workspace = true }
fstart-driver-lenovo = { workspace = true }
fstart-driver-tpm = { workspace = true }
fstart-log = { workspace = true }
fstart-options = { workspace = true }
ufmt = { workspace = true }

[features]
# Host tests and tools see the whole board. fbuild builds every stage with
# --no-default-features and adds `acpi` to the ramstage only.
default = ["acpi"]
# The ACPI and SMBIOS tables (`src/acpi.rs`), which need the ramstage heap.
acpi = ["dep:fstart-acpi", "dep:fstart-acpi-macros", "fstart-driver-lenovo/acpi"]
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-intel/bundle-smm"]

[lints]
workspace = true

[package]
name = "fstart-board-lenovo-x200"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "lenovo-x200"
platform = "x86_64"
target = "x86_64-unknown-none"
stage-bin = "fstart-stage"
build-profile = { dependency = "fstart-platform-intel", name = "rust" }

[dependencies]
fstart-core = { path = "../../../crates/core", features = ["pci"] }
fstart-platform-intel = { path = "../../../crates/platform-intel", features = ["gm45-ich9"] }
fstart-driver-intel = { path = "../../../crates/driver-intel" }
fstart-driver-usbdebug = { path = "../../../crates/driver-usbdebug" }
fstart-driver-lenovo = { path = "../../../crates/driver-lenovo", features = ["acpi"] }
fstart-pci = { path = "../../../crates/pci" }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-acpi-macros = { path = "../../../crates/acpi-macros" }
fstart-arch = { path = "../../../crates/arch", features = ["x86_64"] }
fstart-log = { path = "../../../crates/log" }
ufmt = { workspace = true }

[[bin]]
name = "fstart-stage"
path = "src/main.rs"

[package]
name = "fstart-board-tyan-s8030"
description = "Tyan S8030 (S8030GM2NE, S8030GM4NE-2T): AMD SP3 1P, EPYC 7002/7003"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# One firmware build for Rome and Milan, composed into both 16 MiB halves
# of the 32 MiB flash (docs/amd-sp3.md). The generations are features of
# the platform dependency below, so every build of this crate (the reset
# unit and fbuild's host plan runner, which never sees bundle-stage) has
# them. GM2NE and GM4NE-2T run the same image (README.md), so they are not
# variants. `tyan-s8030-pcie3-x4x4x4x4` bifurcates PCIE#3 x4x4x4x4 by
# default, for an NVMe carrier (the test bench); the settings menu
# overrides either default.
[package.metadata.fstart]
schema = 1
board = "tyan-s8030"
name = "S8030"
platform = "x86_64"
target = "x86_64-unknown-none"
build-profile = { dependency = "fstart-platform-sp3", name = "rust" }

# The board's APCBs of each generation, as its vendor image has them.
[package.metadata.fstart.amd.rome]
apcb = { entries = [
  { type = 0x68, file = "s8030/rome/apcb-68-0.bin" },
  { type = 0x68, instance = 8, level = 2, file = "s8030/rome/apcb-68-8.bin" },
  { type = 0x68, instance = 9, level = 2, file = "s8030/rome/apcb-68-9.bin" },
  { type = 0x60, level = 2, file = "s8030/rome/apcb-60-0.bin" },
  { type = 0x60, instance = 1, level = 2, file = "s8030/rome/apcb-60-1.bin" },
] }

[package.metadata.fstart.amd.milan]
apcb = { entries = [
  { type = 0x68, subprogram = 1, file = "s8030/milan/apcb-68-0.bin" },
  { type = 0x68, subprogram = 1, instance = 8, level = 2, file = "s8030/milan/apcb-68-8.bin" },
  { type = 0x68, subprogram = 1, instance = 9, level = 2, file = "s8030/milan/apcb-68-9.bin" },
  { type = 0x60, subprogram = 1, level = 2, file = "s8030/milan/apcb-60-0.bin" },
  { type = 0x60, subprogram = 1, instance = 1, level = 2, file = "s8030/milan/apcb-60-1.bin" },
] }

# The vendor BIOS update whose PSP firmware and microcode the image takes
# (the same 32 MiB ROM as vendor/8030V404.ROM).
[package.metadata.fstart.donor]
vendor = "MiTAC (Tyan)"
name = "S8030GM2NE BIOS V4.04"
url = "https://www.mitaccomputing.com/api-frontend/Document/DownloadVersionFile/versions/1710/download"
sha256 = "28ef7d2d35d82675e18a86e870fa862793dcb585be4bb53798f4a5af9c014faf"
size = 24359479
terms = "https://www.mitaccomputing.com/terms"
page = "https://www.mitaccomputing.com/products/detail/S8030GM2NE?tab=downloads"
note = "MiTAC's download page also asks you to accept AMI's end-user licence for this BIOS. fstart keeps the PSP firmware, APCB and microcode from it and replaces the rest."

[package.metadata.fstart.variants.tyan-s8030-pcie3-x4x4x4x4]
name = "S8030 (PCIe slot 3 as x4x4x4x4)"
# A setting of the same board, not another board: UIs offer it as an option.
option = "PCIe slot 3 split x4x4x4x4"
features = ["pcie3-x4x4x4x4"]

[features]
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-sp3/smm"]
pcie3-x4x4x4x4 = []

# Versions are spelled out instead of inherited: boards are outside the
# workspace (fbuild adds them to a generated one) and this crate also
# builds on its own.
[dependencies]
fstart-log = { path = "../../../crates/log" }
fstart-options = { path = "../../../crates/options" }
fstart-platform-sp3 = { path = "../../../crates/platform-sp3", features = ["acpi", "rome", "milan"] }
fstart-driver-amd = { path = "../../../crates/driver-amd", features = ["rome", "milan"] }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-core = { path = "../../../crates/core" }
fstart-driver-ipmi = { path = "../../../crates/driver-ipmi", features = ["acpi"] }
fstart-driver-superio = { path = "../../../crates/driver-superio", features = ["acpi"] }
fstart-driver-uart = { path = "../../../crates/driver-uart", features = ["pio"] }
embedded-hal = { version = "1", default-features = false }
heapless = { version = "0.8", default-features = false }
tock-registers = "0.10"

# The only stage, which the PSP copies to DRAM; fbuild builds it with
# fstart-platform-sp3/bundle-stage. Board unit tests (`cargo test`) only
# build the library.
[[bin]]
name = "stage"
path = "src/bin/stage.rs"
test = false
bench = false

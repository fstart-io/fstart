[package]
name = "fstart-board-bananapi-m1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.fstart]
board = "bananapi-m1"
platform = "armv7"
target = "armv7a-none-eabi"

[dependencies]
fstart-types = { workspace = true, features = ["std"] }
fstart-device-registry = { workspace = true, features = ["all-drivers"] }
fstart-driver-ns16550 = { workspace = true }
fstart-driver-sunxi-ccu = { workspace = true }
fstart-driver-sunxi-a20-dramc = { workspace = true }
fstart-driver-sunxi-mmc = { workspace = true }

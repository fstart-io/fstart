[package]
name = "fstart-board-qemu-aarch64"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "qemu-aarch64"
platform = "aarch64"
target = "aarch64-unknown-none"
stage-bin = "fstart-stage"
features = ["qemu-aarch64"]

[features]
default = []
host = ["dep:fbuild", "fstart-platform-qemu/host"]
runtime = []
stage = [
  "runtime",
  "dep:fstart-driver-uart",
  "dep:fstart-stage",
  "fstart-platform-qemu/stage",
]
aarch64 = ["fstart-stage?/aarch64", "fstart-platform-qemu/aarch64"]
aarch64-el2-relocate-entry = ["fstart-stage?/aarch64-el2-relocate-entry"]
ffs = ["fstart-stage?/ffs"]
ed25519 = ["fstart-stage?/ed25519"]
sha2-digest = ["fstart-stage?/sha2-digest"]
sha3-digest = ["fstart-stage?/sha3-digest"]
lz4 = ["fstart-stage?/lz4"]
fdt = ["fstart-stage?/fdt"]
linux = ["fstart-stage?/linux", "fstart-platform-qemu/linux"]
crabefi = ["fstart-stage?/crabefi", "fstart-platform-qemu/crabefi"]
fit = ["fstart-stage?/fit"]
handoff = ["fstart-stage?/handoff"]
qemu-aarch64 = []

[dependencies]
fstart-core = { path = "../../crates/core" }
fstart-platform-qemu = { path = "../../crates/platform-qemu" }
fstart-driver-uart = { path = "../../crates/driver-uart", optional = true }
fstart-stage = { path = "../../crates/stage", optional = true }
fbuild = { path = "../../tools/fbuild", optional = true }

[[bin]]
name = "fstart-stage"
path = "src/main.rs"
required-features = ["stage"]

[[bin]]
name = "fstart-host"
path = "src/host_main.rs"
required-features = ["host"]

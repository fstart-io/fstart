[package]
name = "fstart-board-google-vilboz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Build/check/editor support only: the native boot/image contract is incomplete.
[package.metadata.fstart]
board = "google-vilboz"
arch = "x86_64"
build-profile = { dependency = "fstart-platform-amd" }

# The board's AMD firmware next to its SoC's (docs/amd-image-format.md,
# "Firmware blobs"): the APCB instances, one per RAM ID, as the vendor ROM
# has them (`google-vilboz/apcb/<n>.bin` in the --blobs directory), and
# fstart's PSP application, without which the PSP of the Chromebook part
# never starts the x86 cores.
[package.metadata.fstart.amd]
soc = "picasso"
psp-app = true
apcb = { instances = 13 }

[features]
default = []
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-amd/smm"]

[dependencies]
fstart-platform-amd = { path = "../../../crates/platform-amd" }
fstart-driver-amd = { path = "../../../crates/driver-amd" }
fstart-driver-chromeec = { path = "../../../crates/driver-chromeec", features = ["acpi"] }
fstart-core = { path = "../../../crates/core" }
fstart-driver-uart = { path = "../../../crates/driver-uart" }
fstart-log = { path = "../../../crates/log" }
ufmt = { workspace = true }
embedded-hal = { workspace = true }

[dev-dependencies]
fstart-core = { path = "../../../crates/core", features = ["testing"] }

# The only stage, which the PSP copies to DRAM: src/bin/stage.rs.

[package]
name = "fstart-board-google-vilboz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Discovery only: no production build-profile contract is exported yet.
# Do not let this incomplete board break discovery of unrelated platforms.
[package.metadata.fstart]
schema = 1
board = "google-vilboz"
platform = "x86_64"
target = "x86_64-unknown-none"
stage-bin = "picasso-checkpoint"

# Explicitly non-bootable standalone console checkpoint, not a native OS flow.
[workspace]

[features]
default = []
checkpoint = []

[dependencies]
fstart-platform-amd = { path = "../../../crates/platform-amd", features = ["picasso"] }
fstart-driver-amd = { path = "../../../crates/driver-amd", features = ["picasso"] }
fstart-driver-chromeec = { path = "../../../crates/driver-chromeec" }

[[bin]]
name = "picasso-checkpoint"
path = "src/main.rs"
required-features = ["checkpoint"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

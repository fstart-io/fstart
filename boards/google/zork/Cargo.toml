[package]
name = "fstart-board-google-vilboz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Build/check/editor support only: the native boot/image contract is incomplete.
[package.metadata.fstart]
board = "google-vilboz"
name = "Vilboz (Chromebook)"
arch = "x86_64"
build-profile = { dependency = "fstart-platform-amd" }

# Board inputs alongside the SoC's blobs: one vendor APCB per RAM ID at
# google-vilboz/apcb/<n>.bin relative to --blobs,
# and fstart's PSP application, which starts the Chromebook's x86 cores.
[package.metadata.fstart.amd]
soc = "picasso"
psp-app = true
apcb = { instances = 13 }

[features]
default = []
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-amd/smm"]

[dependencies]
fstart-platform-amd = { workspace = true }
fstart-driver-amd = { workspace = true }
fstart-driver-chromeec = { workspace = true, features = ["acpi"] }
fstart-core = { workspace = true }
fstart-driver-uart = { workspace = true }
fstart-log = { workspace = true }
ufmt = { workspace = true }
embedded-hal = { workspace = true }

[dev-dependencies]
fstart-core = { workspace = true, features = ["testing"] }
# The DSDT test (src/acpi_tests.rs).
fstart-acpi = { workspace = true }
fstart-pci = { workspace = true }

# The only stage, which the PSP copies to DRAM: src/bin/stage.rs.

[lints]
workspace = true

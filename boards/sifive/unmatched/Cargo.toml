[package]
name = "fstart-board-sifive-unmatched"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
schema = 1
board = "sifive-unmatched"
platform = "riscv64"
target = "riscv64gc-unknown-none-elf"
build-profile = { dependency = "fstart-platform-sifive", name = "rust" }

[dependencies]
embedded-hal = { workspace = true }
fstart-core = { path = "../../../crates/core" }
fstart-driver-sifive = { path = "../../../crates/driver-sifive" }
fstart-driver-uart = { path = "../../../crates/driver-uart" }
fstart-log = { path = "../../../crates/log" }
fstart-platform-sifive = { path = "../../../crates/platform-sifive", default-features = false }

# One binary per stage, named after the stage: src/bin/stage.rs.

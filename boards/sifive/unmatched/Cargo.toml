[package]
name = "fstart-board-sifive-unmatched"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "sifive-unmatched"
name = "HiFive Unmatched"
arch = "riscv64"
build-profile = { dependency = "fstart-platform-sifive" }

[dependencies]
embedded-hal = { workspace = true }
fstart-core = { workspace = true }
fstart-driver-sifive = { workspace = true }
fstart-driver-uart = { workspace = true }
fstart-log = { workspace = true }
fstart-platform-sifive = { workspace = true, default-features = false }

# One binary per stage, named after the stage: src/bin/stage.rs.

[lints]
workspace = true

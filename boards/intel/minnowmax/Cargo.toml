[package]
name = "fstart-board-intel-minnowmax"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "intel-minnowmax"
arch = "x86_64"
build-profile = { dependency = "fstart-platform-intel" }

[features]
# Host tests and tools see the whole board. fbuild builds every stage with
# --no-default-features and adds `acpi` to the ramstage only.
default = ["acpi"]
# The board's ACPI device, which needs the ramstage heap.
acpi = ["dep:fstart-acpi"]
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-intel/bundle-smm"]

[dependencies]
fstart-core = { workspace = true, features = ["pci"] }
fstart-platform-intel = { workspace = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-driver-intel = { workspace = true }
fstart-driver-uart = { workspace = true, features = ["pio"] }
fstart-log = { workspace = true }
ufmt = { workspace = true }

# One binary per stage, named after the stage: src/bin/<stage>.rs.

[lints]
workspace = true

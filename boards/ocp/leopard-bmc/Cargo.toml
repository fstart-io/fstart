[package]
name = "fstart-board-ocp-leopard-bmc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The AST1250 BMC of the OCP Leopard server.
[package.metadata.fstart]
board = "ocp-leopard-bmc"
name = "OCP Leopard BMC (AST1250)"
arch = "armv5te"
build-profile = { dependency = "fstart-platform-aspeed" }

[dependencies]
fstart-core = { workspace = true }
fstart-platform-aspeed = { workspace = true }
fstart-driver-uart = { workspace = true }
fstart-log = { workspace = true }

# One binary per stage, named after the stage: src/bin/<stage>.rs.

[lints]
workspace = true

[package]
name = "fstart-board-qemu-riscv64"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.fstart]
board = "qemu-riscv64"
platform = "riscv64"
target = "riscv64gc-unknown-none-elf"
stage-bin = "fstart-stage"
tool-bin = "fstart-board-tool"

[features]
default = ["host"]
host = [
  "fstart-types/std",
  "dep:fstart-board-qemu-virt",
  "dep:fstart-board-meta",
  "dep:heapless",
  "dep:xtask",
]
stage = [
  "dep:fstart-stage",
  "dep:fstart-stage-runtime",
  "dep:fstart-services",
  "dep:fstart-log",
  "dep:fstart-capabilities",
  "dep:fstart-platform-riscv64",
  "dep:ufmt",
]
riscv64 = ["stage", "fstart-stage/riscv64"]
ns16550 = ["stage", "fstart-stage/ns16550", "dep:fstart-driver-ns16550"]
ffs = ["stage", "fstart-stage/ffs"]
ed25519 = ["stage", "fstart-stage/ed25519"]
sha2-digest = ["stage", "fstart-stage/sha2-digest"]
sha3-digest = ["stage", "fstart-stage/sha3-digest"]
lz4 = ["stage", "fstart-stage/lz4"]
fdt = ["stage", "fstart-stage/fdt"]
stage-flow-console-init = ["stage", "fstart-stage/stage-flow-console-init"]
stage-flow-memory-init = ["stage", "fstart-stage/stage-flow-memory-init"]
stage-flow-boot-media = ["stage", "fstart-stage/stage-flow-boot-media"]
stage-flow-ffs = ["stage", "fstart-stage/stage-flow-ffs"]
stage-flow-payload-load = ["stage", "fstart-stage/stage-flow-payload-load"]
stage-flow-fdt = ["stage", "fstart-stage/stage-flow-fdt"]

[dependencies]
fstart-types = { workspace = true }
fstart-board-qemu-virt = { workspace = true, optional = true }
fstart-board-meta = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
xtask = { path = "../../xtask", optional = true }
fstart-stage = { workspace = true, optional = true }
fstart-stage-runtime = { workspace = true, optional = true }
fstart-services = { workspace = true, optional = true }
fstart-log = { workspace = true, optional = true }
fstart-capabilities = { workspace = true, optional = true }
fstart-platform-riscv64 = { workspace = true, optional = true }
fstart-driver-ns16550 = { workspace = true, optional = true }
ufmt = { workspace = true, optional = true }

[[bin]]
name = "fstart-board-tool"
path = "src/bin/fstart-board-tool.rs"
required-features = ["host"]

[[bin]]
name = "fstart-stage"
path = "src/main.rs"
required-features = ["stage"]

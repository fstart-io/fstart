[package]
name = "fstart-board-qemu-riscv64"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.fstart]
board = "qemu-riscv64"
platform = "riscv64"
target = "riscv64gc-unknown-none-elf"
stage-package = "fstart-board-qemu-riscv64-stage"
stage-bin = "fstart-stage"

[dependencies]
fstart-board-qemu-riscv64-facts = { path = "facts" }
fstart-types = { workspace = true, features = ["std"] }

[package]
name = "fstart-board-gigabyte-mj11-ec1-bmc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The AST2500 BMC of the MJ11-EC1; the EPYC host is gigabyte-mj11-ec1.
[package.metadata.fstart]
schema = 1
board = "gigabyte-mj11-ec1-bmc"
platform = "armv5te"
target = "armv5te-none-eabi"
build-profile = { dependency = "fstart-platform-aspeed", name = "rust" }

[dependencies]
fstart-core = { path = "../../../crates/core" }
fstart-platform-aspeed = { path = "../../../crates/platform-aspeed" }
fstart-driver-uart = { path = "../../../crates/driver-uart" }
fstart-log = { path = "../../../crates/log" }

# One binary per stage, named after the stage: src/bin/<stage>.rs.

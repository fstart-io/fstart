[package]
name = "fstart-board-gigabyte-mj11"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# MJ11-EC1 (G431-MM0) by default; MJ11-EC0 is a variant with the F02 tables.
[package.metadata.fstart]
schema = 1
board = "gigabyte-mj11-ec1"
name = "MJ11-EC1"
platform = "x86_64"
target = "x86_64-unknown-none"
build-profile = { dependency = "fstart-platform-amd", name = "rust" }

# The board's APCBs: level 1 has the vendor's recovery APCB, level 2 the
# one the ABL boots with.
[package.metadata.fstart.amd]
soc = "zeppelin"
apcb = { entries = [
  { type = 0x60, level = 1, file = "mj11/apcb-recovery.bin" },
  { type = 0x68, level = 1, file = "mj11/apcb-recovery.bin" },
  { type = 0x60, level = 2, file = "mj11/apcb.bin" },
  { type = 0x68, level = 2, file = "mj11/apcb-backup.bin" },
] }

# The official BIOS update whose PSP firmware and microcode the image takes.
# Gigabyte publishes only the EC0's F02; both variants assemble from it.
[package.metadata.fstart.donor]
vendor = "GIGABYTE"
name = "MJ11-EC0 BIOS F02"
url = "https://download.gigabyte.com/FileList/BIOS/server_bios_MJ11-EC0_F02.zip"
sha256 = "f02f3f423c6482aa2ec43356be7a64b6e4c3a2429c23893fc4939e300fc75d60"
size = 13426298
terms = "https://www.gigabyte.com/WebPage/469/EULA.html"
page = "https://www.gigabyte.com/Enterprise/Server-Motherboard/MJ11-EC0-rev-12/support#support-dl-bios"
note = "Gigabyte publishes this BIOS (F02) for the MJ11-EC0. fstart takes only its PSP firmware and microcode; images built from it have not been tested on hardware yet."

[package.metadata.fstart.variants.gigabyte-mj11-ec0]
name = "MJ11-EC0"
features = ["ec0"]

[features]
default = []
ec0 = []
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-amd/smm"]

[dependencies]
fstart-platform-amd = { path = "../../../crates/platform-amd", features = ["zeppelin"] }
fstart-acpi = { path = "../../../crates/acpi", features = ["x86"] }
fstart-driver-amd = { path = "../../../crates/driver-amd", features = ["zeppelin"] }
fstart-driver-superio = { path = "../../../crates/driver-superio", features = ["acpi"] }
fstart-driver-uart = { path = "../../../crates/driver-uart", features = ["pio"] }
fstart-pci = { path = "../../../crates/pci" }
fstart-log = { path = "../../../crates/log" }
ufmt = { workspace = true }
embedded-hal = { workspace = true }
fstart-driver-ipmi = { path = "../../../crates/driver-ipmi", features = ["acpi"] }
fstart-arch = { path = "../../../crates/arch", features = ["x86_64"] }
zerocopy = { workspace = true }
tock-registers = { workspace = true }

# The only stage, which the PSP copies to DRAM: src/bin/stage.rs.

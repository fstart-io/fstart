# Board memory policy. Firmware ABI/defaults live in templates/.
schema = 1

[memory]
ecc = true
power-down = true
parity = false
restore-context = false
ignore-spd-checksum = true
speed-limits = [
  { module = "udimm", slots-per-channel = [1], single-rank-dimms = 1, maximum-mt-s = 2933 },
  { module = "udimm", slots-per-channel = [1], dual-rank-dimms = 1, maximum-mt-s = 2667 },
  { module = "udimm", slots-per-channel = [2], single-rank-dimms = 1, maximum-mt-s = 2667 },
  { module = "udimm", slots-per-channel = [2], dual-rank-dimms = 1, maximum-mt-s = 2400 },
  { module = "udimm", slots-per-channel = [2], single-rank-dimms = 2, maximum-mt-s = 2133 },
  { module = "udimm", slots-per-channel = [2], single-rank-dimms = 1, dual-rank-dimms = 1, maximum-mt-s = 1866 },
  { module = "udimm", slots-per-channel = [2], dual-rank-dimms = 2, maximum-mt-s = 1866 },
  { module = "udimm", training = "stretch", slots-per-channel = [1], single-rank-dimms = 1, maximum-mt-s = 3200 },
  { module = "udimm", training = "stretch", slots-per-channel = [1], dual-rank-dimms = 1, maximum-mt-s = 2933 },
  { module = "udimm", training = "stretch", slots-per-channel = [2], single-rank-dimms = 1, maximum-mt-s = 2933 },
  { module = "udimm", training = "stretch", slots-per-channel = [2], dual-rank-dimms = 1, maximum-mt-s = 2667 },
  { module = "udimm", training = "stretch", slots-per-channel = [2], single-rank-dimms = 2, maximum-mt-s = 2400 },
  { module = "udimm", training = "stretch", slots-per-channel = [2], single-rank-dimms = 1, dual-rank-dimms = 1, maximum-mt-s = 2133 },
  { module = "udimm", training = "stretch", slots-per-channel = [2], dual-rank-dimms = 2, maximum-mt-s = 2133 },
  { module = "rdimm", slots-per-channel = [1], single-rank-dimms = 1, maximum-mt-s = 2933 },
  { module = "rdimm", slots-per-channel = [1], dual-rank-dimms = 1, maximum-mt-s = 2667 },
  { module = "rdimm", slots-per-channel = [2], single-rank-dimms = 1, maximum-mt-s = 2667 },
  { module = "rdimm", slots-per-channel = [2], dual-rank-dimms = 1, maximum-mt-s = 2400 },
  { module = "rdimm", slots-per-channel = [2], single-rank-dimms = 2, maximum-mt-s = 2133 },
  { module = "rdimm", slots-per-channel = [2], single-rank-dimms = 1, dual-rank-dimms = 1, maximum-mt-s = 1866 },
  { module = "rdimm", slots-per-channel = [2], dual-rank-dimms = 2, maximum-mt-s = 2133 },
  { module = "rdimm", training = "stretch", slots-per-channel = [1], single-rank-dimms = 1, maximum-mt-s = 3200 },
  { module = "rdimm", training = "stretch", slots-per-channel = [1], dual-rank-dimms = 1, maximum-mt-s = 2933 },
  { module = "rdimm", training = "stretch", slots-per-channel = [2], single-rank-dimms = 1, maximum-mt-s = 2933 },
  { module = "rdimm", training = "stretch", slots-per-channel = [2], dual-rank-dimms = 1, maximum-mt-s = 2667 },
  { module = "rdimm", training = "stretch", slots-per-channel = [2], single-rank-dimms = 2, maximum-mt-s = 2400 },
  { module = "rdimm", training = "stretch", slots-per-channel = [2], single-rank-dimms = 1, dual-rank-dimms = 1, maximum-mt-s = 2133 },
  { module = "rdimm", training = "stretch", slots-per-channel = [2], dual-rank-dimms = 2, maximum-mt-s = 2133 },
]

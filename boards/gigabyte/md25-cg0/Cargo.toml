[package]
name = "fstart-board-gigabyte-md25-cg0"
description = "GIGABYTE MD25-CG0: 1P SP7 server board, AMD Venice"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.fstart]
board = "gigabyte-md25-cg0"
name = "MD25-CG0"
arch = "x86_64"
build-profile = { dependency = "fstart-platform-amd" }

# Board APCBs and eSPI strap for MD25-CG0 (AST2700 BMC on eSPI0); Venice's
# SoC blobs live in fstart-platform-amd's [package.metadata.fstart.amd.venice].
[package.metadata.fstart.amd]
soc = "venice"
efs-espi = [0x0e, 0xff, 0xff, 0xff]
# Identical in F01 release and debug. Meaning not yet established.
efs-byte-59 = 0x71
apcb = { entries = [
  { type = 0x60, instance = 0, writable = true, file = "md25-cg0/apcb-60-0.bin" },
  { type = 0x60, instance = 1, writable = true, file = "md25-cg0/apcb-60-1.bin" },
  { type = 0x68, instance = 0, file = "md25-cg0/apcb-68-0.bin" },
  { type = 0x68, instance = 8, file = "md25-cg0/apcb-68-8.bin" },
  { type = 0x68, instance = 9, file = "md25-cg0/apcb-68-9.bin" },
] }

[features]
# The SMM handler module, enabled only for the SMM image.
smm = ["fstart-platform-amd/smm"]

[dependencies]
fstart-platform-amd = { workspace = true }
fstart-driver-amd = { workspace = true }
fstart-driver-ipmi = { workspace = true, features = ["acpi"] }
fstart-driver-superio = { workspace = true, features = ["acpi"] }
fstart-driver-uart = { workspace = true, features = ["pio"] }
fstart-acpi = { workspace = true, features = ["x86"] }
fstart-log = { workspace = true }
tock-registers = { workspace = true }

[dev-dependencies]
fstart-driver-amd = { workspace = true, features = ["testing"] }

[[bin]]
name = "stage"
path = "src/bin/stage.rs"
test = false
bench = false

[lints]
workspace = true

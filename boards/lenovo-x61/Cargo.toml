[package]
name = "fstart-board-lenovo-x61"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[package.metadata.fstart]
board = "lenovo-x61"
platform = "x86_64"
target = "x86_64-unknown-none"
stage-bin = "fstart-stage"
features = [
  "intel-gm965",
  "intel-ich8",
  "nsc-pc87382",
  "nsc-pc87392",
  "i2c-ck505",
]

[features]
default = []
runtime = []
crabefi = ["fstart-platform-intel-gm965-ich8/crabefi", "fstart-stage?/crabefi"]
stage = [
  "runtime",
  "dep:fstart-driver-intel-ich8",
  "dep:fstart-driver-ns16550",
  "dep:fstart-platform-x86_64",
  "dep:fstart-stage",
  "fstart-platform-intel-gm965-ich8/stage",
]
x86_64 = ["fstart-stage?/x86_64"]
x86-static-page-tables = ["fstart-stage?/x86-static-page-tables"]
x86-writable-page-tables = ["fstart-stage?/x86-writable-page-tables"]
x86-1g-pages = ["fstart-stage?/x86-1g-pages"]
ffs = ["fstart-stage?/ffs"]
ed25519 = ["fstart-stage?/ed25519"]
sha2-digest = ["fstart-stage?/sha2-digest"]
sha3-digest = ["fstart-stage?/sha3-digest"]
lz4 = ["fstart-stage?/lz4"]
fit = ["fstart-stage?/fit"]
fdt = ["fstart-stage?/fdt"]
handoff = ["fstart-stage?/handoff"]
intel-gm965 = []
intel-ich8 = ["dep:fstart-driver-intel-ich8"]
nsc-pc87382 = []
nsc-pc87392 = []
i2c-ck505 = []
acpi = [
  "dep:fstart-acpi",
  "dep:fstart-acpi-macros",
  "fstart-stage?/acpi",
  "fstart-platform-intel-gm965-ich8/acpi",
  "dep:fstart-mp",
  "fstart-driver-intel-gm965/acpi",
  "fstart-driver-intel-gm965/ffs-vbt",
  "fstart-driver-intel-ich8?/acpi",
]
mp = ["stage", "dep:fstart-cpu-intel", "dep:fstart-mp"]
smbios = ["fstart-platform-intel-gm965-ich8/smbios"]
smm = [
  "dep:fstart-driver-intel-ich8",
  "dep:fstart-smm-runtime",
  "dep:fstart-smm-stage",
]

[dependencies]
fstart-types = { workspace = true }
fstart-platform-intel-gm965-ich8 = { workspace = true }
fstart-platform-x86_64 = { workspace = true, optional = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-acpi-macros = { path = "../../crates/fstart-acpi-macros", optional = true }
fstart-arch-x86 = { workspace = true }
fstart-driver-i2c-ck505 = { workspace = true }
fstart-driver-intel-gm965 = { workspace = true, features = ["ffs-vbt"] }
fstart-driver-intel-ich8 = { workspace = true, optional = true }
fstart-driver-ns16550 = { workspace = true, features = ["pio"], optional = true }
fstart-driver-nsc-pc87382 = { workspace = true }
fstart-driver-nsc-pc87392 = { workspace = true }
fstart-gpio-ich = { workspace = true }
fstart-hda = { workspace = true }
fstart-pio = { workspace = true }
fstart-services = { workspace = true, features = ["pci"] }
fstart-superio = { workspace = true }
fstart-cpu-intel = { workspace = true, optional = true }
fstart-mp = { workspace = true, optional = true }
fstart-smbios = { workspace = true }
fstart-smm-runtime = { workspace = true, optional = true }
fstart-smm-stage = { workspace = true, optional = true }
fstart-stage = { workspace = true, optional = true }

[[bin]]
name = "fstart-stage"
path = "src/main.rs"
required-features = ["stage"]

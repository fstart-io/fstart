[package]
name = "fstart-board-lenovo-x61"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[package.metadata.fstart]
board = "lenovo-x61"
platform = "x86_64"
target = "x86_64-unknown-none"
stage-bin = "fstart-stage"
features = [
  "intel-gm965",
  "intel-ich8",
  "nsc-pc87382",
  "nsc-pc87392",
  "i2c-ck505",
]

[features]
default = []
runtime = []
crabefi = ["fstart-stage?/crabefi"]
stage = [
  "runtime",
  "dep:fstart-driver-uart",
  "dep:fstart-platform-x86_64",
  "dep:fstart-stage",
  "fstart-platform-intel-gm965-ich8/stage",
]
x86_64 = ["fstart-stage?/x86_64"]
x86-static-page-tables = ["fstart-stage?/x86-static-page-tables"]
x86-writable-page-tables = ["fstart-stage?/x86-writable-page-tables"]
x86-1g-pages = ["fstart-stage?/x86-1g-pages"]
ffs = ["fstart-stage?/ffs"]
ed25519 = ["fstart-stage?/ed25519"]
sha2-digest = ["fstart-stage?/sha2-digest"]
sha3-digest = ["fstart-stage?/sha3-digest"]
lz4 = ["fstart-stage?/lz4"]
fit = ["fstart-stage?/fit"]
fdt = ["fstart-stage?/fdt"]
handoff = ["fstart-stage?/handoff"]
intel-gm965 = []
intel-ich8 = []
nsc-pc87382 = []
nsc-pc87392 = []
i2c-ck505 = []
acpi = [
  "dep:fstart-acpi",
  "dep:fstart-acpi-macros",
  "fstart-stage?/acpi",
  "fstart-platform-intel-gm965-ich8/acpi",
  "dep:fstart-mp",
  "fstart-driver-intel/acpi",
  "fstart-driver-intel/ffs-vbt",
]
mp = ["stage", "dep:fstart-cpu-intel", "dep:fstart-mp"]
smbios = ["fstart-platform-intel-gm965-ich8/smbios"]
smm = [
  "dep:fstart-smm-runtime",
  "dep:fstart-smm-stage",
]

[dependencies]
fstart-types = { path = "../../crates/fstart-types" }
fstart-platform-intel-gm965-ich8 = { path = "../../crates/fstart-platform-intel-gm965-ich8" }
fstart-platform-x86_64 = { path = "../../crates/fstart-platform-x86_64", optional = true }
fstart-acpi = { path = "../../crates/fstart-acpi", features = ["x86"], optional = true }
fstart-acpi-macros = { path = "../../crates/fstart-acpi-macros", optional = true }
fstart-arch-x86 = { path = "../../crates/fstart-arch-x86" }
fstart-driver-intel = { path = "../../crates/fstart-driver-intel", features = ["ffs-vbt"] }
fstart-driver-superio = { path = "../../crates/fstart-driver-superio" }
fstart-driver-uart = { path = "../../crates/fstart-driver-uart", features = ["pio"], optional = true }
fstart-hda = { path = "../../crates/fstart-hda" }
fstart-pio = { path = "../../crates/fstart-pio" }
fstart-services = { path = "../../crates/fstart-services", features = ["pci"] }
fstart-cpu-intel = { path = "../../crates/fstart-cpu-intel", optional = true }
fstart-mp = { path = "../../crates/fstart-mp", optional = true }
fstart-smbios = { path = "../../crates/fstart-smbios" }
fstart-smm-runtime = { path = "../../crates/fstart-smm-runtime", optional = true }
fstart-smm-stage = { path = "../../crates/fstart-smm-stage", optional = true }
fstart-stage = { path = "../../crates/fstart-stage", optional = true }

[[bin]]
name = "fstart-stage"
path = "src/main.rs"
required-features = ["stage"]

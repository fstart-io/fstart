    - name: "INIT_COMPLETE"
      bit_offset: 19
      bit_size: 1
    - name: "XOR_EN"
      bit_offset: 9
      bit_size: 1
    - name: "XOR_DIS"
      bit_offset: 10
      bit_size: 1
  description: "DRAM Controller Control (MCHBAR DCC, 0x200)."
fieldset/DRT0_REG:
  bit_size: 32
  fields:
    - name: "B2B_W_PCHG"
      bit_offset: 28
      bit_size: 4
      description: >-
        B2B write precharge, same bank: CL-1 + BL/2 + tWR (max ~13).
    - name: "B2B_W2R"
      bit_offset: 24
      bit_size: 4
      description: "B2B write-to-read spacing: CL-1 + BL/2 + tWTR (max ~11)."
    - name: "FIXED"
      bit_offset: 16
      bit_size: 8
      description: "Fixed per coreboot: (1<<22)|(3<<20)|(1<<18)."
    - name: "TRD"
      bit_offset: 11
      bit_size: 4
      description: >-
        tRD delay on the FSB in mclk domain: CAS + FSB bump (max ~8).
    - name: "W_AUTO_PCHG"
      bit_offset: 4
      bit_size: 5
      description: "Write auto-precharge, same bank: + tRP (max ~19)."
    - name: "R_AP_TO_ACT"
      bit_offset: 0
      bit_size: 8
      description: "Read auto-precharge to activate: fixed 8."
  description: "DRAM Timing 0 (CxDRT0): read-to-write and tRD assembly."
fieldset/DRT1_REG:
  bit_size: 32
  fields:
    - name: "PAGE"
      bit_offset: 30
      bit_size: 2
      description: "Page-size selector: 0, 1, or 2."
    - name: "TRTP_667"
      bit_offset: 28
      bit_size: 1
      description: "Read-to-precharge at 667 MHz."
    - name: "RCVEN_COARSE"
      bit_offset: 24
      bit_size: 4
      description: "Receive-enable coarse delay (training)."
    - name: "TRAS"
      bit_offset: 19
      bit_size: 8
      description: "Activate to precharge: tras (capped at 0x18)."
    - name: "CAS"
      bit_offset: 8
      bit_size: 3
      description: "CAS latency encoding (cas_table value 0-3)."
    - name: "TRCD"
      bit_offset: 4
      bit_size: 3
      description: "RAS-to-CAS delay: trcd - 2 (max 4)."
    - name: "TRP"
      bit_offset: 0
      bit_size: 3
      description: "RAS precharge: trp - 2 (max 4)."
  description: "DRAM Timing 1 (CxDRT1): CAS/RAS assembly."
fieldset/DRT3_REG:
  bit_size: 32
  fields:
    - name: "US_HI"
      bit_offset: 16
      bit_size: 8
      description: "High byte of the 1us field (table constant)."
    - name: "US_LO"
      bit_offset: 10
      bit_size: 6
      description: "Low nibble-ish of the 1us field (table constant)."
    - name: "REF_MINUS_TRFC"
      bit_offset: 0
      bit_size: 9
      description: "788ns minus tRFC, masked to 9 bits at the use site."
  description: "DRAM Timing 3 (CxDRT3): refresh-window assembly."

name: Set up the Rust CI environment
description: >-
  Install the pinned Rust toolchain, sccache and the shared cargo
  cache, and optionally install apt packages and put llvm-tools on
  PATH. Run after actions/checkout.

inputs:
  packages:
    description: apt packages to install, space separated. Empty installs none.
    default: ""
  llvm-tools:
    description: Put the toolchain's llvm-tools bin directory on PATH.
    default: "false"
  cache-targets:
    description: Also cache compiled dependencies in target/ (cache only).
    default: "false"
  shared-key:
    description: rust-cache shared key (cache only).
    default: cargo-home
  save-cache:
    description: Save the rust-cache at the end of the job (master only).
    default: "false"

runs:
  using: composite
  steps:
    # Toolchain, components and targets all come from rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install

    # Compilation results are shared across jobs and runs through the
    # GitHub Actions cache backend (see SCCACHE_GHA_ENABLED /
    # RUSTC_WRAPPER in ci.yml, which also carries the frame-length
    # workaround that makes sccache viable for x86 firmware builds).
    # Only the sccache binary version is pinned here.
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0

    # The cargo registry (and optionally dependency artifacts), keyed
    # automatically on the toolchain and Cargo.lock. Build outputs beyond
    # that come from sccache per compiler invocation, which also covers
    # the -Zbuild-std firmware units - rust-cache's target cleanup would
    # discard those.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-targets: ${{ inputs.cache-targets }}
        shared-key: ${{ inputs.shared-key }}
        save-if: >-
          ${{ inputs.save-cache == 'true' &&
              github.ref == 'refs/heads/master' }}

    - name: Install apt packages
      if: inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo apt-get update
        # Word splitting is the interface: callers pass a package list.
        # shellcheck disable=SC2086
        sudo apt-get install -y $PACKAGES

    - name: Add llvm-tools to PATH
      if: inputs.llvm-tools == 'true'
      shell: bash
      run: |
        host="$(rustc -vV | sed -n 's/host: //p')"
        echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"

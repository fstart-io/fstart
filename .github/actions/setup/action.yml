name: Set up the Rust CI environment
description: >-
  Install the pinned Rust toolchain and the cargo cache, and optionally
  install apt packages and put llvm-tools on PATH. Run after
  actions/checkout.

inputs:
  packages:
    description: apt packages to install, space separated. Empty installs none.
    default: ""
  llvm-tools:
    description: Put the toolchain's llvm-tools bin directory on PATH.
    default: "false"
  cache-targets:
    description: Also cache compiled dependencies in target/ (cache only).
    default: "false"
  shared-key:
    description: rust-cache shared key (cache only).
    default: cargo-home
  save-cache:
    description: Save the rust-cache at the end of the job (master only).
    default: "false"

runs:
  using: composite
  steps:
    # Toolchain, components and targets all come from rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install

    # The cargo registry (and optionally dependency artifacts), keyed
    # automatically on the toolchain and Cargo.lock. Firmware jobs keep
    # target/ itself in a cache of their own on top of this, since
    # rust-cache's cleanup discards the -Zbuild-std core/alloc artifacts
    # and fbuild unit state under target/fstart-build/.
    #
    # There is deliberately no sccache here: with RUSTC_WRAPPER=sccache,
    # x86 firmware builds hang for 600 s per affected unit. Cargo always
    # passes --json=future-incompat with its JSON message formats, x86
    # -Zbuild-std core answers with an 18 MiB single-line report (8,747
    # `sse` entries, rust-lang/rust#117938), and sccache 0.19.0 deadlocks
    # relaying it. Revisit once sccache handles that message.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-targets: ${{ inputs.cache-targets }}
        shared-key: ${{ inputs.shared-key }}
        save-if: >-
          ${{ inputs.save-cache == 'true' &&
              github.ref == 'refs/heads/master' }}

    - name: Install apt packages
      if: inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo apt-get update
        # Word splitting is the interface: callers pass a package list.
        # shellcheck disable=SC2086
        sudo apt-get install -y $PACKAGES

    - name: Add llvm-tools to PATH
      if: inputs.llvm-tools == 'true'
      shell: bash
      run: |
        host="$(rustc -vV | sed -n 's/host: //p')"
        echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"

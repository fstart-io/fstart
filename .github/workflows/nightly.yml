name: Nightly releases
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish successful CI and prune expired nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish-nightly.py

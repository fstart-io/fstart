name: Nightly releases
# Once a day: bundle the newest master commit whose CI passed, publish the
# bundles as a prerelease and the web assembler on Pages
# (docs/distribution.md). A commit that has a nightly is not built again.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.pending.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: The newest green master commit without a nightly
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(cargo run --locked --release -p fstart-release -- pending)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  distribution:
    needs: pending
    if: needs.pending.outputs.revision != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.revision }}
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: acpica-tools
      - name: Install the WASM target and wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      # coreboot payload bundles ship SeaBIOS, the boot tests' revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fstart-io/seabios
          ref: 44ed85f85fac03107009242c067fdcc01ce55546
          path: target/seabios-src
          persist-credentials: false
      - name: Export the published payloads of every board and variant
        run: bash ci/build-distribution.sh
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution
          path: target/distribution/
          compression-level: 0 # Each bundle is already ZIP/DEFLATE compressed.
          retention-days: 2
          if-no-files-found: error
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-web
          path: target/image-web/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

  # Publishes what `distribution` built and expires old nightlies; with
  # nothing new, it only expires. The bundles are data here: the tool is
  # built from this workflow's checkout, nothing downloaded is run.
  publish:
    needs: [pending, distribution]
    if: >-
      always() && needs.pending.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.distribution.result)
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # actions/download-artifact v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.distribution.result == 'success'
        with:
          name: distribution
          path: ${{ runner.temp }}/distribution
      - name: Publish the nightly and expire old ones
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.pending.outputs.revision }}
          DISTRIBUTION: ${{ runner.temp }}/distribution
        run: |
          if [ -n "$REVISION" ]; then
            set -- --distribution "$DISTRIBUTION" --revision "$REVISION" \
              --run-id "$GITHUB_RUN_ID"
          fi
          cargo run --locked --release -p fstart-release -- nightly "$@"

  pages:
    needs: [distribution, publish]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/download-artifact v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image-web
          path: site
      - name: Point the UI at the release proxy
        env:
          PROXY: ${{ vars.RELEASE_PROXY_URL }}
        run: |
          # Without a proxy the page still assembles downloaded bundles.
          jq -n --arg proxy "$PROXY" --arg repository "$GITHUB_REPOSITORY" \
            '{proxy: $proxy, repository: $repository}' > site/config.json
      # actions/upload-pages-artifact v3
      - uses: >-
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy web assembler
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

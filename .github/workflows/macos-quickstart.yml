name: macOS quick start

on:
  pull_request:
    paths:
      - '.github/workflows/macos-quickstart.yml'
      - '.cargo/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'README.md'
      - 'tools/fbuild/**'
      - 'crates/image-build/**'
      - 'crates/platform-qemu/**'
      - 'boards/qemu/riscv64/**'
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and QEMU
        run: |
          rustup toolchain install
          brew install qemu coreutils
      - name: Build the RISC-V firmware
        run: cargo fbuild build --board qemu-riscv64 --payload halt
      - name: Run the README quick start
        run: |
          # The halt payload leaves QEMU running after firmware startup.
          status=0
          gtimeout --kill-after=5s 30s \
            cargo fbuild qemu --board qemu-riscv64 --payload halt \
            >qemu.log 2>&1 || status=$?
          cat qemu.log
          [[ $status == 0 || $status == 124 ]]
          grep -Fq 'ramstage: ready for payload' qemu.log

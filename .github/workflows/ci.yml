name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  # Incremental state is never reused on CI and only inflates the cache.
  CARGO_INCREMENTAL: 0
  # Host-side debug info (tests, fbuild, platform plan runners) is several GiB
  # across all boards; firmware is built with --release and is unaffected.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Fail on rustc warnings, including ones Cargo replays from cached units.
  # Unlike RUSTFLAGS=-Dwarnings this leaves compiler flags, and with them
  # fbuild's recorded firmware selections and the build cache, untouched.
  CARGO_UNSTABLE_WARNINGS: true
  CARGO_BUILD_WARNINGS: deny

# Build caching: the whole target/ directory is cached, not just third-party
# dependencies, so the -Zbuild-std core/alloc and firmware units under
# target/fstart-build/ are kept too. Caches are only saved from master; pull
# requests restore the most recent master cache for the same toolchain.

jobs:
  distribution:
    needs: [check, qemu-boot-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install toolchain and WASM target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # actions/cache v6.1.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &distribution-cache-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: dist-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            dist-${{ hashFiles('rust-toolchain.toml') }}-
            rust-check-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y acpica-tools
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Export every board, variant, payload and unit binary
        run: |
          touch "$RUNNER_TEMP/distribution-start"
          bash ci/build-distribution.sh
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: target/distribution/
          compression-level: 0 # Each bundle is already ZIP/DEFLATE compressed.
          retention-days: 2 # Daily promotion moves these onto Releases.
          if-no-files-found: error
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-web
          path: target/image-web/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error
      - name: Prune stale firmware plans
        run: bash ci/prune-build-cache.sh "$RUNNER_TEMP/distribution-start"
      # actions/cache v6.1.0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *distribution-cache-paths
          key: dist-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Intel board builds read microcode blobs from intel-microcode/
          # (see fstart-platform-intel/src/host.rs).
          submodules: true

      # Toolchain, components and targets all come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &rust-cache-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: rust-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Mark build start
        run: touch "$RUNNER_TEMP/build-start"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acpica-tools

      - name: Tests
        env:
          RUST_MIN_STACK: 8388608
        run: |
          python3 -m unittest discover -s ci/tpm -p 'test_*.py'
          cargo test --workspace
          cargo test -p fstart-driver-intel \
            --features acpi,i945,gm965,ich8,pineview --lib
          cargo test -p fstart-platform-intel \
            --features host,i945-ich7,gm965-ich8 --lib
          # Each AMD SoC on its own: the boards select one, the tests all.
          for soc in picasso zeppelin naples rome milan; do
            cargo check -p fstart-driver-amd --no-default-features --features "$soc"
          done

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      # Release builds are the reference configuration: every board must
      # link there (see AGENTS.md). Boards are resolved by fbuild from
      # boards/<vendor>/<board>/Cargo.toml package.metadata.fstart.board,
      # which also selects the target triple, so all four targets above
      # must be installed.
      #
      # NOTE: FSTART_EXTRA_RUSTFLAGS must NOT be set here. Resolved builds
      # fail closed on unrecorded ambient inputs (see
      # tools/fbuild/src/selection.rs).
      #
      - name: Build supported boards
        run: |
          mapfile -t boards < <(
            python3 - <<'PY'
          from pathlib import Path
          import tomllib

          boards = {
              metadata["board"]
              for manifest in Path("boards").glob("*/*/Cargo.toml")
              if (metadata := tomllib.loads(manifest.read_text())["package"]["metadata"].get("fstart"))
          }
          print(*sorted(boards), sep="\n")
          PY
          )
          ((${#boards[@]} > 0))
          for board in "${boards[@]}"; do
            cargo fbuild build --board "$board" --release
          done

      - name: Prune stale firmware builds
        if: github.event_name == 'push'
        run: ci/prune-build-cache.sh "$RUNNER_TEMP/build-start"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: *rust-cache-paths
          key: rust-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}

  qemu-boot-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        assets: [payloads, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prepare each shared asset cache once, not in every board job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.assets == 'payloads'
        id: payload-cache
        with:
          path: boot-assets/payloads
          key: ${{ runner.os }}-qemu-payloads-${{ hashFiles('ci/build-payloads.sh', 'ci/kernel-*.config') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.assets == 'x86_64'
        id: x86-boot-assets-cache
        with:
          path: boot-assets/x86_64
          key: ${{ runner.os }}-x86-boot-assets-${{ hashFiles('ci/build-boot-assets.sh', 'ci/create-grub-linux-disk.sh') }}

      - name: Install payload build dependencies
        if: >-
          (matrix.assets == 'payloads' && steps.payload-cache.outputs.cache-hit != 'true') ||
          (matrix.assets == 'x86_64' && steps.x86-boot-assets-cache.outputs.cache-hit != 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison bc build-essential cpio curl flex libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu \
            golang-go grub-efi-amd64-bin grub-common mtools gdisk dosfstools

      - name: Build QEMU payload assets
        if: matrix.assets == 'payloads' && steps.payload-cache.outputs.cache-hit != 'true'
        run: ci/build-payloads.sh boot-assets/payloads

      - name: Build x86_64 GRUB/Linux boot assets
        if: matrix.assets == 'x86_64' && steps.x86-boot-assets-cache.outputs.cache-hit != 'true'
        run: |
          ci/build-boot-assets.sh boot-assets/x86_64
          ci/create-grub-linux-disk.sh boot-assets/x86_64/disk.img \
            boot-assets/x86_64/grubx64.efi boot-assets/x86_64/vmlinuz \
            boot-assets/x86_64/initramfs.cpio boot-assets/x86_64/grub.cfg

  qemu-boot-matrix:
    needs: qemu-boot-assets
    runs-on: ubuntu-latest
    strategy:
      # Report failures from every board rather than cancelling sibling jobs.
      fail-fast: false
      matrix:
        board:
          - qemu-q35
          - qemu-q35-i686
          - qemu-riscv64
          - qemu-sifive-u
          - qemu-aarch64
          - qemu-armv7
          - qemu-sbsa
          - orangepi-r1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain, components and targets all come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.board != 'qemu-q35'
        with:
          path: boot-assets/payloads
          key: ${{ runner.os }}-qemu-payloads-${{ hashFiles('ci/build-payloads.sh', 'ci/kernel-*.config') }}
          # Missing assets must fail CI, not silently skip optional boots.
          fail-on-cache-miss: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.board == 'qemu-q35'
        with:
          path: boot-assets/x86_64
          key: ${{ runner.os }}-x86-boot-assets-${{ hashFiles('ci/build-boot-assets.sh', 'ci/create-grub-linux-disk.sh') }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust-cache-paths
          # Each board owns its firmware cache; matrix jobs must not race to
          # save different target/ contents under the same key.
          key: rust-${{ github.job }}-${{ matrix.board }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: rust-${{ github.job }}-${{ matrix.board }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Mark build start
        run: touch "$RUNNER_TEMP/build-start"

      - name: Run QEMU boot tests
        env:
          BOARD: ${{ matrix.board }}
        run: ci/qemu-boot-tests.sh boot-assets/payloads --board "$BOARD"

      - name: Prune stale firmware builds
        if: github.event_name == 'push'
        run: ci/prune-build-cache.sh "$RUNNER_TEMP/build-start"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: *rust-cache-paths
          key: rust-${{ github.job }}-${{ matrix.board }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}

  tpm-boot-tests:
    needs: qemu-boot-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install TPM boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 swtpm swtpm-tools busybox-static \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso \
            mtools gdisk dosfstools cpio

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: boot-assets/x86_64
          key: ${{ runner.os }}-x86-boot-assets-${{ hashFiles('ci/build-boot-assets.sh', 'ci/create-grub-linux-disk.sh') }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust-cache-paths
          key: rust-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: rust-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      # This revision continues fstart's ACPI event log and locks the TPM.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fstart-io/seabios
          ref: 44ed85f85fac03107009242c067fdcc01ce55546
          path: target/seabios-src
          persist-credentials: false

      - name: Build measured-boot guests and SeaBIOS
        run: |
          ci/tpm/build-guest.sh target/tpm-guest boot-assets/x86_64/vmlinuz \
            /bin/busybox grub-mkstandalone
          ci/payloads/seabios/build.sh target/seabios-src target/seabios

      - name: Test TPM 1.2 and 2.0 through SeaBIOS and CrabEFI
        run: ci/tpm/run-tests.sh target/tpm-guest target/seabios

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: *rust-cache-paths
          key: rust-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}

  # Keep a single stable status check for branch protection.
  qemu-boot-tests:
    if: always()
    needs: [qemu-boot-assets, qemu-boot-matrix, tpm-boot-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all QEMU jobs to pass
        env:
          ASSETS_RESULT: ${{ needs.qemu-boot-assets.result }}
          BOOT_RESULT: ${{ needs.qemu-boot-matrix.result }}
          TPM_RESULT: ${{ needs.tpm-boot-tests.result }}
        run: test "$ASSETS_RESULT" = success && test "$BOOT_RESULT" = success && test "$TPM_RESULT" = success

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  OPENSBI_VERSION: "1.6"
  TFA_VERSION: "2.12.0"
  LINUX_VERSION: "6.12"

jobs:
  # -----------------------------------------------------------------------
  # Code quality: format, lint, unit tests (host crates only)
  # -----------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools, clippy, rustfmt
          targets: riscv64gc-unknown-none-elf, aarch64-unknown-none, armv7a-none-eabi, x86_64-unknown-none

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (host crates)
        run: |
          cargo clippy --workspace \
            --exclude fstart-stage \
            --exclude fstart-platform-riscv64 \
            --exclude fstart-platform-aarch64 \
            --exclude fstart-platform-armv7 \
            --exclude fstart-runtime \
            -- -D warnings

      - name: Tests
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --workspace \
            --exclude fstart-stage \
            --exclude fstart-runtime \
            --exclude fstart-alloc \
            --exclude fstart-crabefi \
            --exclude fstart-platform-x86_64 \
            --exclude fstart-platform-riscv64 \
            --exclude fstart-platform-aarch64 \
            --exclude fstart-platform-armv7

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Cross-build warnings (generated code)
        env:
          FSTART_EXTRA_RUSTFLAGS: -Dwarnings -Astatic-mut-refs
        run: |
          cargo xtask build --board qemu-riscv64 --release
          cargo xtask build --board qemu-aarch64 --release

  # -----------------------------------------------------------------------
  # Discover every board directory so future boards are automatically covered.
  # -----------------------------------------------------------------------
  discover-boards:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.boards.outputs.boards }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Discover boards
        id: boards
        run: |
          boards=$(python3 - <<'PY'
          import json
          from pathlib import Path

          names = sorted(path.parent.name for path in Path("boards").glob("*/board.ron"))
          if not names:
              raise SystemExit("no boards/*/board.ron files found")
          print(json.dumps(names))
          PY
          )
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"
          echo "Discovered boards: ${boards}"

  # -----------------------------------------------------------------------
  # Assemble every board image (cross-compile + FFS/full-flash packaging).
  # -----------------------------------------------------------------------
  build-boards:
    needs: [discover-boards]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.discover-boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf, aarch64-unknown-none, armv7a-none-eabi, x86_64-unknown-none

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-${{ matrix.board }}

      - name: Assemble ${{ matrix.board }}
        env:
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p target/ci
          printf 'fstart CI placeholder payload\n' > target/ci/payload.bin

          if grep -q 'kind: FitImage' "boards/$BOARD/board.ron"; then
            # FIT images are structured payloads; if a board uses FIT, test the
            # board-declared FIT path rather than replacing it with a raw blob.
            cargo xtask assemble --board "$BOARD" --release
          else
            # LinuxBoot/raw payload boards only require opaque bytes for assembly.
            # Supplying placeholders keeps this job focused on firmware assembly
            # and ensures newly added boards are covered without adding CI payloads.
            cargo xtask assemble --board "$BOARD" --release \
              --kernel target/ci/payload.bin \
              --firmware target/ci/payload.bin
          fi

  # -----------------------------------------------------------------------
  # Build external payloads: OpenSBI, TF-A BL31, Linux kernels
  # -----------------------------------------------------------------------
  build-payloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cross-compilers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross \
            make flex bison bc libelf-dev libssl-dev \
            xz-utils curl git

      - name: Cache payloads
        id: cache-payloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: payloads
          key: payloads-opensbi${{ env.OPENSBI_VERSION }}-tfa${{ env.TFA_VERSION }}-linux${{ env.LINUX_VERSION }}-${{ hashFiles('ci/kernel-*.config', 'ci/build-payloads.sh') }}

      - name: Build payloads
        if: steps.cache-payloads.outputs.cache-hit != 'true'
        run: bash ci/build-payloads.sh payloads

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payloads
          path: payloads/
          retention-days: 7

  # -----------------------------------------------------------------------
  # QEMU smoke tests — boards without payloads (firmware boots and halts)
  # -----------------------------------------------------------------------
  qemu-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: qemu-riscv64-multi
            expect: "console ready"
          - board: qemu-aarch64-multi
            expect: "console ready"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf, aarch64-unknown-none, armv7a-none-eabi, x86_64-unknown-none

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Cache QEMU packages
        id: cache-qemu
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/qemu-debs
          key: qemu-debs-${{ runner.os }}-v1

      - name: Install QEMU
        timeout-minutes: 5
        run: |
          if [ "${{ steps.cache-qemu.outputs.cache-hit }}" = "true" ]; then
            sudo dpkg -i ~/qemu-debs/*.deb 2>/dev/null || sudo apt-get install -yf
          else
            sudo apt-get update
            sudo apt-get install -y -d --no-install-recommends \
              qemu-system-misc qemu-system-arm \
              qemu-system-data ipxe-qemu
            mkdir -p ~/qemu-debs
            cp /var/cache/apt/archives/qemu*.deb \
               /var/cache/apt/archives/ipxe*.deb \
               /var/cache/apt/archives/seabios*.deb \
               ~/qemu-debs/ 2>/dev/null || true
            sudo apt-get install -y --no-install-recommends \
              qemu-system-misc qemu-system-arm \
              qemu-system-data ipxe-qemu
          fi

      - name: Build firmware
        run: cargo xtask build --board ${{ matrix.board }} --release

      - name: Run in QEMU (${{ matrix.board }})
        run: |
          timeout 60 cargo xtask run --release \
            --board ${{ matrix.board }} --memory 256M \
            > /tmp/qemu.log 2>&1 || true
          echo "::group::QEMU output"
          cat /tmp/qemu.log
          echo "::endgroup::"
          grep -aqi "${{ matrix.expect }}" /tmp/qemu.log

  # -----------------------------------------------------------------------
  # Build x86_64 boot assets used by the fstart -> CrabEFI boot-chain test.
  # -----------------------------------------------------------------------
  build-boot-assets-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Restore cached boot assets
        id: cache-boot-assets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: boot-assets/x86_64
          key: boot-assets-x86_64-${{ hashFiles('ci/build-boot-assets.sh') }}

      - name: Set up Go (for u-root)
        if: steps.cache-boot-assets.outputs.cache-hit != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Install boot asset build dependencies
        if: steps.cache-boot-assets.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev \
            curl xz-utils git grub-common grub-efi-amd64-bin

      - name: Build boot assets
        if: steps.cache-boot-assets.outputs.cache-hit != 'true'
        run: bash ci/build-boot-assets.sh --arch x86_64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-assets-x86_64
          path: boot-assets/x86_64/
          retention-days: 7

  # -----------------------------------------------------------------------
  # QEMU boot test — fstart hardware init -> CrabEFI -> GRUB -> Linux on Q35.
  # -----------------------------------------------------------------------
  qemu-crabefi-x86_64:
    needs: [build-boot-assets-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: qemu-crabefi-x86_64

      - name: Install QEMU and disk tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-data ipxe-qemu \
            mtools dosfstools gdisk

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boot-assets-x86_64
          path: boot-assets/x86_64

      - name: Create GRUB + Linux disk
        run: |
          bash ci/create-grub-linux-disk.sh \
            target/q35-grub-linux.img \
            boot-assets/x86_64/grubx64.efi \
            boot-assets/x86_64/vmlinuz \
            boot-assets/x86_64/initramfs.cpio \
            boot-assets/x86_64/grub.cfg

      - name: Build fstart + CrabEFI firmware
        run: cargo xtask assemble --board qemu-q35-uefi --release

      - name: Run QEMU Q35 boot-chain test
        env:
          # fstart's Q35 pflash boot path needs TCG. GitHub-hosted runners
          # can expose /dev/kvm, but KVM cannot execute directly from the
          # pflash block device mapping used for this firmware image.
          FSTART_QEMU_ACCEL: tcg
        run: |
          cargo xtask run --release \
            --board qemu-q35-uefi \
            --disk target/q35-grub-linux.img \
            --memory 4G \
            > /tmp/qemu.log 2>&1 &
          qemu_pid=$!
          success='UROOT_BOOT_SUCCESS'
          failure='Kernel panic|BUG:|Oops|Unable to mount root fs'
          for _ in $(seq 1 300); do
            tr -d '\000' < /tmp/qemu.log > /tmp/qemu.clean.log || true
            if grep -Eaq "$failure" /tmp/qemu.clean.log; then
              kill "$qemu_pid" 2>/dev/null || true
              wait "$qemu_pid" 2>/dev/null || true
              echo "::group::QEMU output"
              cat /tmp/qemu.clean.log
              echo "::endgroup::"
              echo "QEMU boot failed" >&2
              exit 1
            fi
            if grep -aq "$success" /tmp/qemu.clean.log; then
              kill "$qemu_pid" 2>/dev/null || true
              wait "$qemu_pid" 2>/dev/null || true
              echo "::group::QEMU output"
              cat /tmp/qemu.clean.log
              echo "::endgroup::"
              exit 0
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              wait "$qemu_pid"
              rc=$?
              tr -d '\000' < /tmp/qemu.log > /tmp/qemu.clean.log || true
              echo "::group::QEMU output"
              cat /tmp/qemu.clean.log
              echo "::endgroup::"
              echo "QEMU exited before success marker (status $rc)" >&2
              exit 1
            fi
            sleep 1
          done
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          tr -d '\000' < /tmp/qemu.log > /tmp/qemu.clean.log || true
          echo "::group::QEMU output"
          cat /tmp/qemu.clean.log
          echo "::endgroup::"
          echo "QEMU timed out before success marker" >&2
          exit 1

  # -----------------------------------------------------------------------
  # QEMU boot tests — full boot chain: fstart -> SBI/ATF -> Linux
  # -----------------------------------------------------------------------
  qemu-boot:
    needs: [build-payloads]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: qemu-riscv64
            firmware: payloads/fw_dynamic.bin
            kernel: payloads/Image-riscv64
            memory: 1G
          - board: qemu-aarch64
            firmware: payloads/bl31.bin
            kernel: payloads/Image-aarch64
            memory: 1G
          - board: qemu-armv7
            firmware: ""
            kernel: payloads/zImage-armv7
            memory: 512M
          - board: sifive-unmatched
            firmware: payloads/fw_dynamic.bin
            kernel: payloads/Image-riscv64
            memory: 1G
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf, aarch64-unknown-none, armv7a-none-eabi, x86_64-unknown-none

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Cache QEMU packages
        id: cache-qemu
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/qemu-debs
          key: qemu-debs-${{ runner.os }}-v1

      - name: Install QEMU
        timeout-minutes: 5
        run: |
          if [ "${{ steps.cache-qemu.outputs.cache-hit }}" = "true" ]; then
            sudo dpkg -i ~/qemu-debs/*.deb 2>/dev/null || sudo apt-get install -yf
          else
            sudo apt-get update
            sudo apt-get install -y -d --no-install-recommends \
              qemu-system-misc qemu-system-arm \
              qemu-system-data ipxe-qemu
            mkdir -p ~/qemu-debs
            cp /var/cache/apt/archives/qemu*.deb \
               /var/cache/apt/archives/ipxe*.deb \
               /var/cache/apt/archives/seabios*.deb \
               ~/qemu-debs/ 2>/dev/null || true
            sudo apt-get install -y --no-install-recommends \
              qemu-system-misc qemu-system-arm \
              qemu-system-data ipxe-qemu
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: payloads
          path: payloads

      - name: Build and assemble firmware
        run: |
          ARGS=(--board "${{ matrix.board }}")
          if [ -n "${{ matrix.firmware }}" ]; then
            ARGS+=(--firmware "${{ matrix.firmware }}")
          fi
          ARGS+=(--kernel "${{ matrix.kernel }}")
          cargo xtask assemble --release "${ARGS[@]}"

      - name: Run in QEMU (${{ matrix.board }})
        run: |
          ARGS=(--board "${{ matrix.board }}" --memory "${{ matrix.memory }}")
          if [ -n "${{ matrix.firmware }}" ]; then
            ARGS+=(--firmware "${{ matrix.firmware }}")
          fi
          ARGS+=(--kernel "${{ matrix.kernel }}")
          cargo xtask run --release "${ARGS[@]}" \
            > /tmp/qemu.log 2>&1 &
          qemu_pid=$!
          success='FSTART_CI_BOOT_SUCCESS'
          failure='Kernel panic|BUG:|Oops|Unable to mount root fs'
          saw_linux=0
          for _ in $(seq 1 300); do
            if grep -aq "Linux version" /tmp/qemu.log; then
              saw_linux=1
            fi
            if grep -Eaq "$failure" /tmp/qemu.log; then
              kill "$qemu_pid" 2>/dev/null || true
              wait "$qemu_pid" 2>/dev/null || true
              echo "::group::QEMU output"
              cat /tmp/qemu.log
              echo "::endgroup::"
              echo "QEMU boot failed" >&2
              exit 1
            fi
            if grep -aq "$success" /tmp/qemu.log && [ "$saw_linux" -eq 1 ]; then
              kill "$qemu_pid" 2>/dev/null || true
              wait "$qemu_pid" 2>/dev/null || true
              echo "::group::QEMU output"
              cat /tmp/qemu.log
              echo "::endgroup::"
              exit 0
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              wait "$qemu_pid"
              rc=$?
              echo "::group::QEMU output"
              cat /tmp/qemu.log
              echo "::endgroup::"
              echo "QEMU exited before success marker (status $rc)" >&2
              exit 1
            fi
            sleep 1
          done
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          echo "::group::QEMU output"
          cat /tmp/qemu.log
          echo "::endgroup::"
          echo "QEMU timed out before success marker" >&2
          exit 1

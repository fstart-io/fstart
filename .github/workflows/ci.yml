name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools, rustfmt
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Tests
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --workspace

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Build supported boards
        env:
          FSTART_EXTRA_RUSTFLAGS: -Dwarnings -Astatic-mut-refs
        run: |
          cargo fbuild build --board lenovo-x61 --release
          cargo fbuild build --board foxconn-d41s --release

  assemble-boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [lenovo-x61, foxconn-d41s]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-02-26
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Add llvm-tools to PATH
        run: |
          TOOLCHAIN_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-${{ matrix.board }}

      - name: Assemble ${{ matrix.board }}
        run: cargo fbuild assemble --board ${{ matrix.board }} --release

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer pull-request push makes the previous run's results worthless. A
# started master run is never cancelled, so its caches are saved; GitHub
# still drops a master run that is waiting when a newer push queues, and
# that commit gets no stage sizes (the size report then says so).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Size comparisons must use the same SMBIOS date on master and PRs.
  # A changing date also changes plan hashes and compiler/linker paths,
  # perturbing code generation even in stages that do not use SMBIOS.
  # 2025-01-01 UTC; deliberately not a commit timestamp.
  SOURCE_DATE_EPOCH: "1735689600"
  # Incremental state is never reused on CI and only inflates the cache.
  CARGO_INCREMENTAL: 0
  # Host-side debug info (tests, fbuild, platform plan runners) is several GiB
  # across all boards; firmware is built with --release and is unaffected.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Fail on rustc warnings, including ones Cargo replays from cached units.
  # Unlike RUSTFLAGS=-Dwarnings this leaves compiler flags, and with them
  # fbuild's recorded firmware selections and the build cache, untouched.
  CARGO_UNSTABLE_WARNINGS: true
  CARGO_BUILD_WARNINGS: deny
  # Compilation is cached per rustc invocation by sccache (installed by
  # .github/actions/setup) and shared by every job through the GitHub
  # Actions cache, firmware units included.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # sccache up to 0.19.0 caps client<->daemon frames at 8 MiB, but a frame
  # carries a whole compiler output, and rustc's future-incompat report
  # when building core for x86 is a single 18 MiB JSON line: the daemon
  # could not answer those compiles and clients hung until its 600 s idle
  # timeout. Raise the cap to the 4-byte wire maximum until a release
  # ships without the 8 MiB default (and closes the connection when a
  # reply cannot be written). The daemon inherits this on auto-start.
  SCCACHE_MAX_FRAME_LENGTH: "4294967295"
  # Some host tests need more than libtest's 2 MiB thread stack.
  RUST_MIN_STACK: 8388608

# Every job names its runner image: the packages a job installs are the
# image's, and ubuntu-latest moves between releases job by job while GitHub
# rolls a new one out. (Ubuntu 26.04 ships qemu-system-riscv64 in
# qemu-system-riscv, 24.04 in qemu-system-misc.)
jobs:
  # The cheap gate every firmware job waits for: formatting, and the job
  # matrix. fbuild resolves the boards from boards/<vendor>/<board>/Cargo.toml
  # package.metadata.fstart, the same discovery every other fbuild command
  # uses, and groups them into jobs (tools/fbuild/src/shards.rs).
  boards:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Register layout
        run: cargo ffmt --check

      - name: List firmware shards
        id: list
        run: |
          shards=$(cargo fbuild shards)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  # The workflows, and the Nix of the boot assets. The tools come from the
  # flake's lint shell, pinned by flake.lock like everything else Nix builds.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Workflows
        run: nix develop .#lint --command actionlint
      - name: Workflow security
        run: nix develop .#lint --command zizmor --offline .github
      - name: Nix formatting
        run: nix develop .#lint --command nixfmt --check flake.nix ci/boot-assets/default.nix

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: acpica-tools
          cache-targets: "true"
          shared-key: test
          save-cache: "true"

      # What `cargo test` builds: the host libraries and tools with their
      # default features, tests included. A warning fails the step
      # (CARGO_BUILD_WARNINGS).
      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

      # The feature selections and targets beyond those (fbuild's checks.rs).
      - name: Crate checks
        run: cargo fbuild checks

  # Every discovered board and variant must link in release, and boot the
  # tests its platform declares for it. Runners are the scarce resource, so a
  # job builds a whole shard of boards in one target directory (host tools
  # and shared units compile once) and then boots them from it. A
  # failing board or boot never stops the ones after it, nor other shards.
  # Nor do failed boot assets stop the builds: the job waits for the assets
  # but runs without them, and only the boots are lost.
  firmware:
    name: firmware (${{ matrix.shard }})
    needs: [boards, boot-assets]
    if: ${{ !cancelled() && needs.boards.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.boards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Intel board builds read microcode blobs from intel-microcode/
          # (see fstart-platform-intel/src/host.rs).
          submodules: true
      - uses: ./.github/actions/setup
        with:
          llvm-tools: "true"
          packages: acpica-tools ${{ matrix.packages }}

      # NOTE: FSTART_EXTRA_RUSTFLAGS must NOT be set here. Resolved builds
      # fail closed on unrecorded ambient inputs (tools/fbuild/src/selection.rs).
      - name: Build and test boards
        env:
          BOARDS: ${{ matrix.boards }}
        run: |
          # The board list is space separated.
          # shellcheck disable=SC2086
          cargo fbuild build-boards --size-dir stage-sizes $BOARDS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-sizes-${{ matrix.shard }}
          path: stage-sizes/
          if-no-files-found: error
          retention-days: 7

      # Missing assets must fail CI, not silently skip boots: download-artifact
      # errors when the producer uploaded nothing. Only shards QEMU can
      # emulate (with packages to install) boot.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: boot-assets
        if: ${{ !cancelled() && matrix.packages != '' }}
        with:
          name: boot-assets
          path: boot-assets

      # Boots still run when another board of the shard failed to build.
      - name: Boot tests
        if: >-
          ${{ !cancelled() && matrix.packages != '' &&
              steps.boot-assets.outcome == 'success' }}
        env:
          BOARDS: ${{ matrix.boards }}
        run: |
          # shellcheck disable=SC2086
          cargo fbuild boot-test --assets boot-assets $BOARDS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: boot-test-logs-${{ matrix.shard }}
          path: target/boot-tests/
          if-no-files-found: ignore

  # Stage sizes of every board, kept as an artifact of each run. The
  # size-report workflow compares a pull request's with its base's. Builds
  # are only comparable from the same checkout path, which CI always uses.
  stage-sizes:
    needs: firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fbuild merges the records; sccache has its units from the boards job.
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stage-sizes-*
          merge-multiple: true
          path: stage-sizes
      - name: Record stage sizes
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat stage-sizes/*.jsonl > "$RUNNER_TEMP/stage-sizes.jsonl"
          cargo fbuild sizes merge "$RUNNER_TEMP/stage-sizes.jsonl" stage-sizes.json \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" ${PR:+--pr "$PR"}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-sizes
          path: stage-sizes.json
          retention-days: 90

  # What the boot tests boot besides fstart, built by Nix from inputs pinned
  # by flake.lock and ci/boot-assets. The cache carries the assets across
  # runs; within a run they travel as an artifact, so a cache eviction
  # cannot fail a boot.
  boot-assets:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: boot-assets
          key: boot-assets-${{ hashFiles('flake.nix', 'flake.lock', 'ci/boot-assets/**') }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build boot assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix build -L .#boot-assets
          cp -rL result boot-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-assets
          path: boot-assets
          if-no-files-found: error
          retention-days: 1

  # The one status check that says whether the run passed.
  check:
    if: always()
    needs: [boards, lint, test, boot-assets, firmware, stage-sizes]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success")' <<< "$RESULTS"

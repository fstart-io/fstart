name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer pull-request push makes the previous run's results worthless;
# master runs always finish so their caches stay warm.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

env:
  # Size comparisons must use the same SMBIOS date on master and PRs.
  # A changing date also changes plan hashes and compiler/linker paths,
  # perturbing code generation even in stages that do not use SMBIOS.
  # 2025-01-01 UTC; deliberately not a commit timestamp.
  SOURCE_DATE_EPOCH: "1735689600"
  # Incremental state is never reused on CI and only inflates the cache.
  CARGO_INCREMENTAL: 0
  # Host-side debug info (tests, fbuild, platform plan runners) is several GiB
  # across all boards; firmware is built with --release and is unaffected.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Fail on rustc warnings, including ones Cargo replays from cached units.
  # Unlike RUSTFLAGS=-Dwarnings this leaves compiler flags, and with them
  # fbuild's recorded firmware selections and the build cache, untouched.
  CARGO_UNSTABLE_WARNINGS: true
  CARGO_BUILD_WARNINGS: deny
  # Compilation is cached per rustc invocation by sccache (installed by
  # .github/actions/setup) and shared by every job through the GitHub
  # Actions cache, firmware units included.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # sccache up to 0.19.0 caps client<->daemon frames at 8 MiB, but a frame
  # carries a whole compiler output, and rustc's future-incompat report
  # when building core for x86 is a single 18 MiB JSON line: the daemon
  # could not answer those compiles and clients hung until its 600 s idle
  # timeout. Raise the cap to the 4-byte wire maximum until a release
  # ships without the 8 MiB default (and closes the connection when a
  # reply cannot be written). The daemon inherits this on auto-start.
  SCCACHE_MAX_FRAME_LENGTH: "4294967295"

jobs:
  # The board lists the matrices below run on. fbuild resolves them from
  # boards/<vendor>/<board>/Cargo.toml package.metadata.fstart, the same
  # discovery every other fbuild command uses.
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      boards: ${{ steps.list.outputs.boards }}
      qemu-matrix: ${{ steps.list.outputs.qemu-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      - name: List boards
        id: list
        run: |
          cargo fbuild boards --json > "$RUNNER_TEMP/boards.json"
          {
            echo "boards=$(jq -c '[.[].board]' "$RUNNER_TEMP/boards.json")"
            # The boot script names its own combinations, one CI job each:
            # every boot runs against its own timeout, so a board's serial
            # boots (qemu-q35 alone has six) must not share one job.
            echo "qemu-matrix=$(ci/qemu-boot-tests.sh --list | jq -Rnc '
              {include: [inputs | split(" ") | {board: .[0], payload: .[1]}]}')"
          } >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: acpica-tools
          cache-targets: "true"
          shared-key: test
          save-cache: "true"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Tests
        env:
          RUST_MIN_STACK: 8388608
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 -m unittest discover -s ci/tpm -p 'test_*.py'
          cargo test --workspace
          cargo test -p fstart-driver-intel \
            --features acpi,i945,gm965,ich8,pineview \
            --features gm45,ich9,ironlake,spi,display --lib
          cargo test -p fstart-platform-intel \
            --features i945-ich7,gm965-ich8,pineview-ich7 \
            --features gm45-ich9,ironlake-ibexpeak,memory-cache,acpi,host --lib
          cargo test -p fstart-boot --features crabefi-ui --lib
          cargo test -p fstart-intel-gma --features i945,g45,ironlake --lib
          cargo test -p fstart-log --no-default-features
          cargo test -p fstart-log --features debug-consoles
          # Each AMD SoC on its own: the boards select one, the tests all.
          for soc in picasso zeppelin naples rome milan; do
            cargo check -p fstart-driver-amd --no-default-features --features "$soc"
          done

  # Release builds are the reference configuration: every board must link
  # there (see AGENTS.md). One job per board; a failure never cancels the
  # boards still running.
  build-board:
    needs: boards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Intel board builds read microcode blobs from intel-microcode/
          # (see fstart-platform-intel/src/host.rs).
          submodules: true
      - uses: ./.github/actions/setup
        with:
          llvm-tools: "true"
          packages: acpica-tools

      # NOTE: FSTART_EXTRA_RUSTFLAGS must NOT be set here. Resolved builds
      # fail closed on unrecorded ambient inputs (see
      # tools/fbuild/src/selection.rs).
      - name: Build ${{ matrix.board }}
        env:
          BOARD: ${{ matrix.board }}
        run: |
          cargo fbuild build --board "$BOARD" --release \
            --size-report "stage-sizes-$BOARD.jsonl"

      # CI cannot boot the Unmatched, so at least assemble every payload
      # its plan offers. Inputs are placeholders: this checks the plan's
      # input inventory and image construction, not the payload itself.
      - name: Assemble payloads
        if: matrix.board == 'sifive-unmatched'
        run: |
          input="$RUNNER_TEMP/placeholder.bin"
          printf 'fstart CI placeholder' > "$input"
          cp "$input" boards/sifive/unmatched/unmatched.dtb
          cargo fbuild assemble --board sifive-unmatched --release --payload halt
          cargo fbuild assemble --board sifive-unmatched --release --payload linux \
            --kernel "$input" --firmware "$input"
          cargo fbuild assemble --board sifive-unmatched --release --payload uefi \
            --firmware "$input"

      # Linking firmware does not execute the workspace-excluded Intel
      # boards' policy, SPD-map or complete-DSDT host tests.
      - name: Test Intel board library
        env:
          BOARD: ${{ matrix.board }}
          RUST_MIN_STACK: 8388608
        run: |
          package=$(python3 - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          for manifest in Path("boards").glob("*/*/Cargo.toml"):
              data = tomllib.loads(manifest.read_text())
              if "fstart-platform-intel" not in data.get("dependencies", {}):
                  continue
              metadata = data["package"]["metadata"]["fstart"]
              if metadata["board"] == os.environ["BOARD"]:
                  print(data["package"]["name"])
          PY
          )
          if [[ -n "$package" ]]; then
            host=$(rustc -vV | awk '$1 == "host:" { print $2 }')
            manifest="target/fstart-workspaces/$BOARD/Cargo.toml"
            cargo test --manifest-path "$manifest" \
              -p "$package" --target "$host" --lib
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-sizes-${{ matrix.board }}
          path: stage-sizes-${{ matrix.board }}.jsonl
          if-no-files-found: error
          retention-days: 7

  # Stage sizes of every board, kept as an artifact of each run. The
  # size-report workflow compares a pull request's with its base's. Builds
  # are only comparable from the same checkout path, which CI always uses.
  stage-sizes:
    needs: build-board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: stage-sizes-*
          merge-multiple: true
          path: stage-sizes
      - name: Record stage sizes
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat stage-sizes/*.jsonl > "$RUNNER_TEMP/stage-sizes.jsonl"
          python3 ci/stage_sizes.py merge "$RUNNER_TEMP/stage-sizes.jsonl" stage-sizes.json \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" ${PR:+--pr "$PR"}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-sizes
          path: stage-sizes.json
          retention-days: 90

  # Keep a single stable status check for everything the old check job ran.
  check:
    if: always()
    needs: [test, build-board, stage-sizes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests and board builds to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-board.result }}
          SIZES_RESULT: ${{ needs.stage-sizes.result }}
        run: >-
          test "$TEST_RESULT" = success &&
          test "$BUILD_RESULT" = success &&
          test "$SIZES_RESULT" = success

  qemu-boot-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        assets: [payloads, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cache carries the assets across runs; within a run they travel
      # as artifacts (uploaded below) so a boot job cannot be failed by a
      # cache eviction between this job and its consumers.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.assets == 'payloads'
        id: payload-cache
        with:
          path: boot-assets/payloads
          key: ${{ runner.os }}-qemu-payloads-${{ hashFiles('ci/build-payloads.sh', 'ci/kernel-*.config') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.assets == 'x86_64'
        id: x86-boot-assets-cache
        with:
          path: boot-assets/x86_64
          key: ${{ runner.os }}-x86-boot-assets-${{ hashFiles('ci/build-boot-assets.sh', 'ci/create-grub-linux-disk.sh') }}

      - name: Install payload build dependencies
        if: >-
          (matrix.assets == 'payloads' && steps.payload-cache.outputs.cache-hit != 'true') ||
          (matrix.assets == 'x86_64' && steps.x86-boot-assets-cache.outputs.cache-hit != 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison bc build-essential cpio curl flex libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu \
            golang-go grub-efi-amd64-bin grub-common mtools gdisk dosfstools

      - name: Build QEMU payload assets
        if: matrix.assets == 'payloads' && steps.payload-cache.outputs.cache-hit != 'true'
        run: ci/build-payloads.sh boot-assets/payloads

      - name: Build x86_64 GRUB/Linux boot assets
        if: matrix.assets == 'x86_64' && steps.x86-boot-assets-cache.outputs.cache-hit != 'true'
        run: |
          ci/build-boot-assets.sh boot-assets/x86_64
          ci/create-grub-linux-disk.sh boot-assets/x86_64/disk.img \
            boot-assets/x86_64/grubx64.efi boot-assets/x86_64/vmlinuz \
            boot-assets/x86_64/initramfs.cpio boot-assets/x86_64/grub.cfg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-assets-${{ matrix.assets }}
          path: boot-assets/${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 1

  qemu-boot-matrix:
    needs: [qemu-boot-assets, boards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Report failures from every boot rather than cancelling sibling jobs.
      fail-fast: false
      matrix: ${{ fromJSON(needs.boards.outputs.qemu-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: qemu-system-arm qemu-system-misc qemu-system-x86

      # Missing assets must fail CI, not silently skip optional boots:
      # download-artifact errors when the producer uploaded nothing.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.board != 'qemu-q35'
        with:
          name: boot-assets-payloads
          path: boot-assets/payloads

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.board == 'qemu-q35'
        with:
          name: boot-assets-x86_64
          path: boot-assets/x86_64

      - name: Run QEMU boot test
        env:
          BOARD: ${{ matrix.board }}
          PAYLOAD: ${{ matrix.payload }}
        run: >-
          ci/qemu-boot-tests.sh boot-assets/payloads
          --board "$BOARD" --payload "$PAYLOAD"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: qemu-boot-logs-${{ matrix.board }}-${{ matrix.payload }}
          path: target/qemu-boot-tests/
          if-no-files-found: ignore

  tpm-boot-tests:
    needs: qemu-boot-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: >-
            qemu-system-x86 swtpm swtpm-tools busybox-static
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso
            mtools gdisk dosfstools cpio

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: boot-assets-x86_64
          path: boot-assets/x86_64

      # This revision continues fstart's ACPI event log and locks the TPM.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fstart-io/seabios
          ref: 44ed85f85fac03107009242c067fdcc01ce55546
          path: target/seabios-src
          persist-credentials: false

      - name: Build measured-boot guests and SeaBIOS
        run: |
          ci/tpm/build-guest.sh target/tpm-guest boot-assets/x86_64/vmlinuz \
            /bin/busybox grub-mkstandalone
          ci/payloads/seabios/build.sh target/seabios-src target/seabios

      - name: Test TPM 1.2 and 2.0 through SeaBIOS and CrabEFI
        run: ci/tpm/run-tests.sh target/tpm-guest target/seabios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tpm-boot-logs
          path: target/tpm-tests/
          if-no-files-found: ignore

  # Keep a single stable status check for branch protection.
  qemu-boot-tests:
    if: always()
    needs: [qemu-boot-assets, qemu-boot-matrix, tpm-boot-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all QEMU jobs to pass
        env:
          ASSETS_RESULT: ${{ needs.qemu-boot-assets.result }}
          BOOT_RESULT: ${{ needs.qemu-boot-matrix.result }}
          TPM_RESULT: ${{ needs.tpm-boot-tests.result }}
        run: >-
          test "$ASSETS_RESULT" = success &&
          test "$BOOT_RESULT" = success &&
          test "$TPM_RESULT" = success

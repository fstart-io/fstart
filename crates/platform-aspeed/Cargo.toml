[package]
name = "fstart-platform-aspeed"
description = "ASPEED BMC SoC platform flows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
host = ["dep:fstart-image-build", "dep:serde_json"]
armv5te = ["fstart-arch/armv5te"]

[dependencies]
fstart-core = { workspace = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "arm")'.dependencies]
fstart-arch = { workspace = true }

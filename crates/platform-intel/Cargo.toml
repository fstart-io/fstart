[package]
name = "fstart-platform-intel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
memory-cache = ["fstart-driver-intel/spi"]
# Additive hardware availability; each board enables its chipset pair once.
gm965-ich8 = ["dep:konst", "fstart-driver-intel/gm965", "fstart-driver-intel/ich8"]
i945-ich7 = ["dep:konst", "fstart-driver-intel/i945", "fstart-driver-intel/ich7"]
pineview-ich7 = ["dep:konst", "fstart-driver-intel/pineview", "fstart-driver-intel/ich7"]
host = ["dep:fstart-image-build", "dep:serde_json", "dep:raw-cpuid"]
bundle-bootblock = ["stage", "fstart-stage/x86_64", "fstart-stage/x86-static-page-tables", "fstart-stage/handoff", "fstart-stage/bootstrap", "fstart-stage/ffs", "fstart-stage/ffs-signature", "fstart-stage/ed25519", "fstart-stage/sha2-digest"]
bundle-postcar = ["stage", "fstart-stage/x86_64", "fstart-stage/handoff", "fstart-stage/bootstrap", "fstart-stage/lz4"]
bundle-ramstage = ["stage", "acpi", "mp", "smbios", "fstart-driver-intel/display", "fstart-stage/x86_64", "fstart-stage/handoff", "fstart-stage/ffs", "fstart-stage/sha2-digest", "fstart-stage/lz4", "fstart-stage/acpi"]
bundle-smm = ["dep:fstart-smm", "fstart-smm/stage-bin"]
payload-uefi = ["payload-uefi-basic", "fstart-stage/crabefi"]
payload-uefi-ui = ["payload-uefi", "fstart-stage/crabefi-ui"]
payload-uefi-basic = ["fstart-stage/crabefi-basic"]
payload-linux = ["fstart-stage/linux"]
payload-coreboot = ["fstart-stage/coreboot", "dep:fstart-coreboot"]

stage = [
  "dep:fstart-driver-superio",
  "dep:fstart-driver-uart",
  "dep:fstart-log",
  "dep:fstart-stage",
  "dep:fstart-store",
  "dep:fstart-ffs",
  "fstart-stage/ffs",
  "dep:fstart-arch",
  "dep:ufmt",
  "fstart-core/pci",
]
acpi = [
  "dep:fstart-acpi",
  "dep:fstart-store",
  "dep:fstart-arch",
  "dep:fstart-log",
  "dep:ufmt",
  "fstart-driver-intel/acpi",
]
mp = ["stage", "dep:fstart-arch", "dep:fstart-ffs", "fstart-stage/ffs"]
smbios = ["stage", "dep:fstart-acpi", "dep:fstart-arch", "dep:raw-cpuid"]

[dev-dependencies]
# The DSDT render test disassembles both Intel southbridges' namespaces, so it
# needs the driver's ACPI builders and the DSDT table writer on the host.
fstart-acpi = { workspace = true, features = ["x86"] }
fstart-driver-intel = { workspace = true, features = ["acpi", "ich7", "ich8"] }

[[test]]
name = "southbridge_dsdt"
required-features = ["acpi"]

[dependencies]
sha2 = { workspace = true }
zerocopy = { workspace = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
fstart-smm = { workspace = true, optional = true }
fstart-core = { workspace = true }
fstart-pci = { workspace = true }
fstart-store = { workspace = true, optional = true }
fstart-driver-intel = { workspace = true }
fstart-driver-superio = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, optional = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-arch = { workspace = true, optional = true, features = ["x86_64"] }
fstart-log = { workspace = true, optional = true }
fstart-timestamp = { workspace = true }
fstart-stage = { workspace = true, optional = true }
fstart-coreboot = { workspace = true, optional = true }
fstart-ffs = { workspace = true, optional = true }
raw-cpuid = { workspace = true, optional = true }
heapless = { workspace = true }
konst = { workspace = true, optional = true }
ufmt = { workspace = true, optional = true }

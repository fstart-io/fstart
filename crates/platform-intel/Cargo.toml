[package]
name = "fstart-platform-intel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# `fbuild --debug` facilities (see debug_console); the plan selects them.
# The board's EHCI debug port console.
ehci-console = ["fstart-log/debug-consoles"]
# The SPI flash log in every stage.
flash-console = ["dep:fstart-driver-flash-console", "fstart-log/debug-consoles"]
host = ["dep:fstart-image-build", "dep:serde_json", "fstart-core/host"]
# Per stage binary: the fstart-stage features change code inside shared
# functions (signature checks, ...), so each stage enables only its own.
# The union still builds, so one selection type-checks every binary.
bundle-bootblock = ["stage", "fstart-stage/x86_64", "fstart-stage/handoff", "fstart-stage/bootstrap", "fstart-stage/ffs-signature", "fstart-stage/ed25519", "fstart-stage/sha2-digest"]
bundle-postcar = ["stage", "fstart-stage/x86_64", "fstart-stage/handoff", "fstart-stage/bootstrap"]
bundle-ramstage = ["ramstage", "fstart-stage/x86_64", "fstart-stage/handoff", "fstart-stage/ffs", "fstart-stage/sha2-digest", "fstart-stage/acpi"]
bundle-smm = ["dep:fstart-smm", "fstart-smm/stage-bin", "fstart-arch/smm-handler"]
payload-uefi = ["payload-uefi-basic", "fstart-payload/crabefi"]
payload-uefi-ui = ["payload-uefi", "fstart-payload/crabefi-ui"]
payload-uefi-basic = ["fstart-payload/crabefi-basic"]
payload-linux = ["fstart-payload/linux"]
payload-coreboot = ["fstart-payload/coreboot", "dep:fstart-coreboot"]

# Common bootstrap support must not pull heap-using mainstage services in.
stage = [
  "dep:fstart-driver-uart",
  "dep:fstart-stage", "fstart-stage/bootstrap",
  "dep:fstart-resume",
  "dep:fstart-ffs",
  "fstart-core/pci",
]
# The DRAM mainstage: payload loading over the FFS directory, with a heap.
ramstage = [
  "stage", "dep:fstart-payload", "fstart-stage/ffs", "fstart-arch/alloc",
  # The option report; earlier stages resolve without allocating.
  "fstart-log/alloc",
]

[dev-dependencies]
# The DSDT render test disassembles both Intel southbridges' namespaces, so it
# needs the driver's ACPI builders and the DSDT table writer on the host.
fstart-acpi = { workspace = true, features = ["x86"] }
fstart-driver-intel = { workspace = true }

[dependencies]
sha2 = { workspace = true }
zerocopy = { workspace = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
fstart-smm = { workspace = true, optional = true }
fstart-core = { workspace = true }
fstart-driver-usbdebug = { workspace = true }
fstart-driver-flash-console = { workspace = true, optional = true }
fstart-pci = { workspace = true }
fstart-resume = { workspace = true, optional = true }
fstart-store = { workspace = true }
fstart-driver-intel = { workspace = true }
fstart-driver-uart = { workspace = true, optional = true }
fstart-acpi = { workspace = true, features = ["x86", "pci"] }
fstart-arch = { workspace = true, features = ["x86_64", "x86-identity-paging"] }
fstart-log = { workspace = true }
fstart-options = { workspace = true }
fstart-driver-rtc = { workspace = true }
fstart-timestamp = { workspace = true }
fstart-stage = { workspace = true, optional = true }
fstart-payload = { workspace = true, optional = true }
fstart-coreboot = { workspace = true, optional = true }
fstart-ffs = { workspace = true, optional = true }
heapless = { workspace = true }
konst = { workspace = true }
ufmt = { workspace = true }

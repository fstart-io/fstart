[package]
name = "fstart-stage-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared no_std stage support. Codegen emits a per-board `_BoardDevices` type
# plus direct `fstart_main` codeflow that calls the `Board` trait methods.

[features]
default = []
# Pulls in the std-requiring `DeviceMask` tests. Host-only; firmware
# builds leave this off.
std = ["fstart-types/std"]

[dependencies]
fstart-types = { workspace = true }
fstart-services = { workspace = true }
fstart-log = { workspace = true }
postcard = { workspace = true }
ufmt = { workspace = true }

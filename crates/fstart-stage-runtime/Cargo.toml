[package]
name = "fstart-stage-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Host-only convenience for tests/docs that need std through shared types.
std = ["fstart-types/std"]
# Static typed-board executor. Board crates pass concrete device containers
# implementing HardwareInit into a fixed handwritten flow selected by coarse
# profile features.
fixed-flow = []
flow-early-platform-v2 = ["fixed-flow"]
flow-memory-v2 = ["fixed-flow"]
flow-bus-v2 = ["fixed-flow"]
flow-storage-v2 = ["fixed-flow"]
flow-security-v2 = ["fixed-flow"]
flow-payload-v2 = ["fixed-flow"]
flow-handoff-v2 = ["fixed-flow"]

[dependencies]
fstart-types = { workspace = true }
fstart-services = { workspace = true }

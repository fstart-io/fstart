[package]
name = "fstart-platform-qemu"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.fstart]
schema = 1

[package.metadata.fstart.layouts.riscv64-xip]
target = "riscv64gc-unknown-none-elf"
entry = "riscv64"
env = "monolithic"
features = [
  "stage",
  "fstart-platform-qemu/virt-riscv64",
  "fstart-platform-qemu/riscv64",
  "fstart-stage/ffs", "fstart-stage/ffs-signature", "fstart-stage/ed25519",
  "fstart-stage/sha2-digest", "fstart-stage/sha3-digest",
  "fstart-stage/fdt", "fstart-stage/lz4",
]
flash = { base = 0x20000000, size = 0x02000000 }
image-capacity = 0x01000000
firmware-offset = 0x01000000
firmware-capacity = 0x01000000
# Includes CrabEFI's ~1.1 MiB initialized data, plus fixed heap and stack.
writable = { base = 0x81000000, size = 0x00400000 }
stack = 0x00100000
heap = 0x00040000
default-payload = "linux"

[package.metadata.fstart.layouts.riscv64-xip.security]
signing_algorithm = "Ed25519"
pubkey_file = "keys/dev-signing.pub"
required_digests = ["Sha256", "Sha3_256"]

[package.metadata.fstart.layouts.riscv64-xip.payloads.halt]
features = []

[package.metadata.fstart.layouts.riscv64-xip.payloads.linux]
features = ["fstart-platform-qemu/linux"]
kernel = { base = 0x82000000, size = 0x04000000 }
kernel-file = "Image"
firmware = { base = 0x80100000, size = 0x00200000 }
firmware-file = "fw_dynamic.bin"
device-tree = { base = 0x87f00000, size = 0x10000 }

[package.metadata.fstart.layouts.riscv64-xip.payloads.uefi]
features = ["fstart-platform-qemu/crabefi"]
firmware = { base = 0x80100000, size = 0x00200000 }
firmware-file = "fw_dynamic.bin"
device-tree = { base = 0x80f00000, size = 0x10000 }

[features]
default = []
virt-riscv64 = ["stage"]
host = []
stage = [
  "dep:fstart-stage",
  "dep:fstart-driver-uart",
  "dep:dtoolkit",
  "dep:heapless",
  "fstart-stage/ffs",
  "fstart-stage/ffs-signature",
]
x86_64 = ["fstart-arch/x86_64", "fstart-stage?/x86_64"]
riscv64 = ["fstart-arch/riscv64", "fstart-stage?/riscv64"]
aarch64 = ["fstart-arch/aarch64", "fstart-stage?/aarch64"]
armv7 = ["fstart-arch/armv7", "fstart-stage?/armv7"]
linux = ["fstart-stage?/linux"]
crabefi = ["fstart-stage?/crabefi"]
smbios = ["fstart-stage?/smbios"]

[dependencies]
fstart-core = { workspace = true }
fstart-arch = { workspace = true }
fstart-log = { workspace = true }
fstart-pci = { workspace = true }
fstart-stage = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, optional = true }
serde = { workspace = true }
dtoolkit = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
ufmt = { workspace = true }

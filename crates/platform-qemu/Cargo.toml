[package]
name = "fstart-platform-qemu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
virt-riscv64 = ["stage"]
virt-aarch64 = ["stage", "fstart-arch/aarch64-el2-relocate-entry"]
host = ["dep:fstart-image-build", "dep:serde_json"]
# Firmware policy belongs to this platform, not per-board forwarding recipes.
bundle-riscv64 = ["virt-riscv64", "riscv64", "virt-image"]
bundle-armv7 = ["stage", "armv7", "virt-image"]
bundle-aarch64 = ["virt-aarch64", "aarch64", "virt-image"]
virt-image = [
  "fstart-stage/ed25519", "fstart-stage/sha2-digest", "fstart-stage/sha3-digest",
  "fstart-stage/fdt", "fstart-stage/lz4",
]
stage = [
  "dep:fstart-stage",
  "dep:fstart-driver-uart",
  "dep:dtoolkit",
  "dep:heapless",
  "fstart-stage/ffs",
  "fstart-stage/ffs-signature",
]
x86_64 = ["fstart-arch/x86_64", "fstart-stage?/x86_64"]
riscv64 = ["fstart-arch/riscv64", "fstart-stage?/riscv64"]
aarch64 = ["fstart-arch/aarch64", "fstart-stage?/aarch64"]
armv7 = ["fstart-arch/armv7", "fstart-stage?/armv7"]
linux = ["fstart-stage?/linux"]
crabefi = ["fstart-stage?/crabefi"]
smbios = ["fstart-stage?/smbios"]

[dependencies]
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
fstart-core = { workspace = true }
fstart-arch = { workspace = true }
fstart-log = { workspace = true }
fstart-pci = { workspace = true }
fstart-stage = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, optional = true }
serde = { workspace = true }
dtoolkit = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
ufmt = { workspace = true }

[package]
name = "fstart-driver-amd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# ACPI descriptions of the FCH devices.
acpi = ["dep:fstart-acpi"]
# The SMBIOS inventory from the APOB.
smbios = ["acpi", "dep:fstart-driver-spd"]
# The FCH SMM handler, for SMM image builds.
smm = ["dep:fstart-smm"]
# A reserved boot-flash region through the FCH SPI100 command engine.
spi-flash = ["dep:rflasher-core", "dep:rflasher-internal"]
# Host models of the register spaces, for the tests of dependent crates.
testing = ["dep:libc", "fstart-core/testing"]

[dependencies]
tock-registers.workspace = true
fstart-core.workspace = true
zerocopy.workspace = true
fstart-pci.workspace = true
heapless.workspace = true
fstart-log.workspace = true
ufmt.workspace = true
fstart-driver-i2c.workspace = true
embedded-hal.workspace = true
fstart-arch = { workspace = true, features = ["x86_64"] }
fstart-smm = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
fstart-amdfw-format.workspace = true
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-driver-spd = { workspace = true, optional = true }
fstart-options.workspace = true
rflasher-core = { workspace = true, optional = true }
rflasher-internal = { workspace = true, optional = true }

[dev-dependencies]
fstart-core = { workspace = true, features = ["testing"] }
# The unit tests cover the optional parts too, also in `cargo test --workspace`.
fstart-driver-amd = { path = ".", features = ["smm", "acpi", "smbios", "spi-flash"] }
fstart-pci = { workspace = true }
libc = "0.2"
fstart-arch = { workspace = true, features = ["x86_64", "testing"] }

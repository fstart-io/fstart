[package]
name = "fstart-arch"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
armv7 = []
aarch64 = []
riscv64 = []
x86_64 = []
x86-1g-pages = []
x86-writable-page-tables = []
x86-static-page-tables = []
early-ffs-anchor = []
postcar-stage-load = ["dep:fstart-ffs"]
acpi = ["dep:acpi_tables"]

[dependencies]
acpi_tables = { version = "0.2", optional = true }
fstart-log = { workspace = true }
fstart-smm = { workspace = true }
fstart-core = { workspace = true }
fstart-ffs = { workspace = true, optional = true }
ufmt = { workspace = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
x86 = { workspace = true }

[build-dependencies]
object = { workspace = true }

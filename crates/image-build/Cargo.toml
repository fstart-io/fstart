[package]
name = "fstart-image-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["std"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
schemars = "0.8"
num-traits = "0.2"
miniz_oxide = { version = "0.8", features = ["with-alloc"] }
heapless = { workspace = true }
object = { workspace = true }
iced-x86 = { workspace = true }
zerocopy = { workspace = true }
fstart-core = { workspace = true }
fstart-amdfw-format = { workspace = true, features = ["serde"] }
# APCB v3 typed tables/tokens. 0.5.5 is not published on crates.io.
amd-apcb = { git = "https://github.com/oxidecomputer/amd-apcb", rev = "1ec66d607de2437813cdd9ffa91719a4b163b3cf", features = ["serde", "schemars"] }
fstart-coreboot = { workspace = true }
fstart-ffs = { workspace = true, features = ["std"] }
fstart-boot = { workspace = true, features = ["std"] }
fstart-crypto = { workspace = true, features = ["all"] }
fstart-smm = { workspace = true, features = ["std", "coreboot"] }
ed25519-dalek = { workspace = true, features = ["std", "rand_core", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[build-dependencies]
object = { workspace = true }

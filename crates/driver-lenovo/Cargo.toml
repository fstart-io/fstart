[package]
name = "fstart-driver-lenovo"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fstart_stage_env, values("car", "postcar", "ram", "smm"))'] }

[features]
default = []
acpi = ["dep:fstart-acpi", "dep:fstart-acpi-macros"]
x86_64 = ["fstart-arch/x86_64"]

[dependencies]
fstart-arch = { workspace = true }
fstart-core = { workspace = true }
fstart-driver-superio = { workspace = true }
fstart-log = { workspace = true }
ufmt = { workspace = true }
tock-registers = { workspace = true }
fstart-acpi = { workspace = true, optional = true }
fstart-acpi-macros = { path = "../acpi-macros", optional = true }

[package]
name = "fstart-platform-amd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
picasso = ["noncar", "fstart-driver-amd/picasso", "dep:fstart-driver-vbios"]
# Host policy only; never enabled by the emitted firmware unit.
host = ["dep:fstart-image-build", "dep:serde_json", "dep:sha2", "fstart-core/host"]
zeppelin = ["noncar", "fstart-driver-amd/zeppelin"]
# The SP3 socket's generations. They are additive: a board enables every
# generation it supports and one reset image serves them all (the CPU
# picks at run time).
naples = ["sp3", "fstart-driver-amd/naples"]
rome = ["sp3", "fstart-driver-amd/rome"]
milan = ["sp3", "fstart-driver-amd/milan"]
sp3 = [
  # Naples is the Zeppelin die.
  "fstart-driver-amd/zeppelin",
  "dep:fstart-amdfw-format",
  "dep:fstart-arch", "fstart-arch/x86-identity-paging",
  "dep:fstart-driver-ipmi",
  "dep:fstart-options",
  "dep:heapless",
  "dep:zerocopy",
  "fstart-log/alloc",
]
# The SP3 tables.
acpi = ["dep:fstart-acpi", "fstart-acpi/pci", "fstart-driver-amd/acpi", "fstart-driver-amd/smbios", "fstart-driver-ipmi?/acpi"]
# The SP3 stage: its entry (the arch crate's asm/amd_psp_reset.S, which
# enters `_start_ram`), the stage runtime, the FFS the payload comes from,
# whose root the signature features authenticate, ACPI and the TPM.
bundle-stage = [
  "media",
  "dep:fstart-stage", "dep:fstart-payload", "fstart-stage/x86_64", "fstart-stage/ffs", "fstart-stage/acpi",
  "fstart-stage/ffs-signature", "fstart-stage/ed25519", "fstart-stage/sha2-digest",
  "acpi", "fstart-stage/tcg", "fstart-payload/tcg",
  "dep:fstart-driver-tpm", "dep:fstart-tcg", "fstart-driver-uart/pio",
  "fstart-arch/amd-psp-reset",
]
# The shared flow of the PSP-booted SoCs, with their ACPI tables.
noncar = [
  "fstart-driver-amd/smi",
  "fstart-driver-amd/acpi",
  "fstart-driver-amd/smbios",
  "dep:fstart-amdfw-format",
  "dep:fstart-arch",
  "dep:fstart-acpi",
  "dep:fstart-acpi-macros",
  "dep:heapless",
]
# The boot media mount of a PSP-booted stage.
media = ["dep:fstart-stage", "fstart-stage/ffs"]
# A noncar reset image: one DRAM stage from reset vector to payload.
bundle = [
  "noncar",
  "media",
  "dep:fstart-stage", "dep:fstart-payload",
  "fstart-arch/x86-identity-paging",
  "fstart-arch/amd-psp-reset",
  "fstart-stage/x86_64",
  "fstart-stage/ffs",
  "fstart-stage/ffs-signature",
  "fstart-stage/ed25519",
  "fstart-stage/sha2-digest",
  ]
bundle-zeppelin = ["zeppelin", "bundle"]
# The Picasso reset image, from PSP entry through payload handoff.
bundle-picasso = ["picasso", "bundle"]
# The SMM handler and `smm_bin!` for a board's SMM unit; the stage embeds
# the image fbuild built from it (FSTART_SMM_IMAGE).
smm = ["fstart-driver-amd/smm", "dep:fstart-smm"]
# SMM-unit builds only: adds the SMM panic handler, which a stage has itself.
bundle-smm = ["smm", "fstart-smm/stage-bin", "fstart-arch/smm-handler"]
payload-linux = ["fstart-payload?/linux"]
# On SP3 the UEFI payload also keeps the settings store: CrabEFI's variable
# store in flash, written through the FCH SPI100 command engine.
payload-uefi = ["payload-uefi-basic", "fstart-payload?/crabefi", "fstart-driver-amd/spi-flash"]
payload-uefi-ui = ["payload-uefi", "fstart-payload?/crabefi-ui", "fstart-payload?/crabefi-elan-i2c", "fstart-payload?/crabefi-hid-i2c"]
payload-uefi-basic = ["fstart-payload?/crabefi-basic", "dep:embedded-hal-bus"]

# Picasso's AMD firmware (docs/amd-image-format.md, "Firmware blobs"):
# paths relative to the --blobs directory, which has the layout of the
# amd_blobs repository and which `cargo fbuild blobs` extracts from a
# vendor ROM. The PSP files follow amd_blobs' Picasso fw.cfg with the
# secure OS and without MP2 (soft fuse bits 28 and 29).
[package.metadata.fstart.amd.picasso]
bios-directory = "Family17hModel10"
efs-offset = 0xe20000
partition-end = 0x1000000
spi-read-mode = 4
spi-speed = 0
soft-fuse = 0x30000000


[dependencies]
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
fstart-driver-amd.workspace = true
fstart-amdfw-format = { workspace = true, optional = true }
fstart-driver-vbios = { workspace = true, optional = true }
fstart-core.workspace = true
fstart-driver-uart.workspace = true
fstart-log.workspace = true
ufmt.workspace = true
fstart-pci.workspace = true
tock-registers.workspace = true
fstart-arch = { workspace = true, optional = true, features = ["x86_64"] }
fstart-stage = { workspace = true, optional = true }
fstart-payload = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
fstart-acpi = { workspace = true, features = ["x86", "pci"], optional = true }
# Devices sharing an I2C controller handed to CrabEFI.
embedded-hal-bus = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
fstart-acpi-macros = { path = "../acpi-macros", optional = true }
fstart-smm = { workspace = true, optional = true }
fstart-driver-ipmi = { path = "../driver-ipmi", optional = true }
fstart-options = { workspace = true, features = ["alloc", "varstore"], optional = true }
fstart-driver-tpm = { workspace = true, optional = true }
fstart-tcg = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }

# build.rs lays the SMM image out as the installer will (TSEG fit check).
[build-dependencies]
fstart-smm = { workspace = true }

[dev-dependencies]
# The unit tests cover every SoC, also in `cargo test --workspace`.
fstart-platform-amd = { path = ".", features = ["picasso", "zeppelin", "naples", "rome", "milan", "acpi", "host", "smm"] }
fstart-driver-amd = { workspace = true, features = ["testing"] }
fstart-arch = { workspace = true, features = ["x86_64", "testing"] }

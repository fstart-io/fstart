[package]
name = "fstart-platform-amd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
picasso = ["fstart-driver-amd/picasso", "dep:fstart-arch"]
# Explicit firmware-only immutable compiler input, not automatic vendor discovery.
linked-microcode = ["picasso"]
# Host policy only; never enabled by the emitted firmware unit.
host = ["dep:fstart-image-build", "dep:serde_json", "dep:sha2"]
# Compiler/check/editor support; still a non-bootable console checkpoint.
bundle-checkpoint = ["picasso"]
zeppelin = ["fstart-driver-amd/zeppelin", "dep:fstart-arch"]
# The Zeppelin ACPI tables.
acpi = ["zeppelin", "dep:fstart-acpi", "dep:fstart-acpi-macros"]
# The Zeppelin reset image: one DRAM stage from reset vector to payload.
bundle-zeppelin = [
  "zeppelin",
  "acpi",
  "dep:fstart-stage",
  "dep:heapless",
  "dep:zerocopy",
  "fstart-arch/x86-identity-paging",
  "fstart-stage/x86_64",
  "fstart-stage/ffs",
  "fstart-stage/ffs-signature",
  "fstart-stage/ed25519",
  "fstart-stage/sha2-digest",
  "fstart-stage/lz4",
]
payload-linux = ["fstart-stage?/linux"]
payload-uefi = ["payload-uefi-basic", "fstart-stage?/crabefi"]
payload-uefi-basic = ["fstart-stage?/crabefi-basic"]

[dependencies]
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
fstart-driver-amd.workspace = true
fstart-core.workspace = true
fstart-driver-uart.workspace = true
fstart-log.workspace = true
ufmt.workspace = true
fstart-pci.workspace = true
fstart-arch = { workspace = true, optional = true, features = ["x86_64"] }
fstart-stage = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-acpi-macros = { path = "../acpi-macros", optional = true }

# Zeppelin (EPYC Embedded 3000): the two-level directories of the vendor
# images. Level 1 is the recovery set; the PSP and the ABL look a file up
# in level 2 first. The PSP writes the erased entries (NV data).
[package.metadata.fstart.amd.zeppelin]
bios-directory = "Family17hModel00"
levels = 2
efs-offset = 0x20000
partition-end = 0x294000
# Fast Read at 33 MHz: the PSP reads the flash about 1 s faster.
spi-read-mode = 7
spi-speed = 1


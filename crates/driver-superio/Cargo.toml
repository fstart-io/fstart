[package]
name = "fstart-driver-superio"
description = "SuperIO framework and chip descriptors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
acpi = ["dep:fstart-acpi", "dep:fstart-acpi-macros"]

[dependencies]
embedded-hal = { workspace = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-acpi-macros = { workspace = true, optional = true }
fstart-log = { workspace = true }
fstart-core = { workspace = true }
heapless = { workspace = true }
ufmt = { workspace = true }
tock-registers = { workspace = true }

[lints]
workspace = true

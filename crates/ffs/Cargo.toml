[package]
name = "fstart-ffs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
std = ["directory", "fstart-crypto/all", "dep:lz4_flex"]
# Mainstage's expressive directory is excluded from bounded bootstrap readers.
directory = ["dep:heapless", "dep:zerocopy"]
alloc = ["fstart-core/alloc"]
# Forward crypto features for firmware (no_std) builds that need verification
ed25519 = ["fstart-crypto/ed25519"]
sha2-digest = ["fstart-crypto/sha2-digest"]
sha3-digest = ["fstart-crypto/sha3-digest"]

[dependencies]
fstart-core = { workspace = true }
fstart-crypto = { workspace = true }
heapless = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
lz4_flex = { workspace = true }

[[test]]
name = "round_trip"
required-features = ["std"]

[package]
name = "fstart-platform-rs"
description = "AMD Rs (SP5/Genoa, SP6/Siena) native PSP reset through payload handoff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The board's SoC: selects the reset image's geometry. One per reset image.
genoa = []
siena = []
bundle-reset = [
  "fstart-platform-amd/rs-usb",
  "fstart-platform-amd/rs-acpi",
  "fstart-platform-amd/rs-smi",
  "fstart-platform-amd/rs-stage",
  "fstart-driver-amd/smbios",
  "dep:fstart-stage",
  "fstart-stage/x86_64",
  "fstart-stage/acpi",
  "dep:fstart-acpi",
  "dep:fstart-pci",
  "dep:fstart-driver-uart",
  "dep:ufmt",
]
payload-linux = ["fstart-platform-amd/rs-linux"]
# CrabEFI, which finds and drives the boot controllers itself.
payload-uefi = ["dep:fstart-boot"]
# The board's SMM unit (`smm_bin!` with `RsSmmHandler`).
smm = ["fstart-platform-amd/rs-smm"]
bundle-smm = ["smm", "fstart-platform-amd/bundle-rs-smm"]
host = ["dep:fstart-image-build", "dep:serde_json", "fstart-platform-amd/host"]

[dependencies]
fstart-platform-amd = { path = "../platform-amd", features = ["rs"], optional = true }
fstart-arch = { workspace = true, features = ["x86_64"] }
fstart-core.workspace = true
fstart-driver-amd = { workspace = true, features = ["rs"] }
fstart-log.workspace = true
fstart-acpi = { workspace = true, optional = true, features = ["x86"] }
fstart-pci = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, optional = true, features = ["pio"] }
fstart-boot = { workspace = true, optional = true, features = ["crabefi-xhci"] }
fstart-stage = { workspace = true, optional = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
heapless.workspace = true
tock-registers.workspace = true
ufmt = { workspace = true, optional = true }

[dev-dependencies]
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

# Genoa's (SP5) AMD firmware, as packed by fstart (crates/image-build/src/amd):
# the directory entries by type, subprogram, instance and level, with the
# file names of AMD's public blobs (coreboot 3rdparty/amd_blobs/genoa), so
# `--blobs` can be that directory plus the board's APCBs. The levels are
# those of the image booted on Onyx; the NV areas are erased flash. The
# reset image ends the 16 MiB the boot ROM maps, the partition before it.
# The EFS generation word is AMD's for Genoa (amdfwtool: FFFFFFFEh).
[package.metadata.fstart.amd.genoa]
bios-directory = "Family19h"
levels = 2
generation-mask = 1
efs-offset = 0x20000
partition-end = 0x800000


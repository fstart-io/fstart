[package]
name = "fstart-platform-sunxi"
description = "Allwinner sunxi platform flows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
host = ["dep:fstart-image-build", "dep:serde_json", "fstart-core/host"]
stage = [
  "dep:fstart-arch",
  "dep:fstart-driver-uart",
  "dep:fstart-log",
  "dep:fstart-stage", "dep:fstart-payload",
  "dep:ufmt",
  "fstart-stage/handoff",
  "fstart-stage/bootstrap",
]
armv7 = [
  "fstart-arch?/armv7",
  "fstart-arch?/sunxi-fel",
  "fstart-driver-sunxi/armv7",
  "fstart-stage?/armv7",
]
aarch64 = [
  "fstart-arch?/aarch64",
  "fstart-stage?/aarch64",
]
riscv64 = [
  "fstart-arch?/riscv64",
  "fstart-stage?/riscv64",
]
a20 = []
d1 = []
h3 = []
linux = ["fstart-payload?/linux", "fstart-stage?/ffs", "fstart-stage?/ffs-signature"]
# Firmware policy belongs to this platform, not per-board forwarding recipes.
# SRAM SPLs use only the bounded, allocation-free bootstrap loader.
bundle-a20-bootblock = ["stage", "a20", "armv7", "fstart-stage?/armv7"]
bundle-a20-main = [
  "stage", "a20", "armv7",
  "fstart-stage?/armv7", "fstart-stage?/ffs", "fstart-stage?/ed25519",
  "fstart-stage?/ffs-signature", "fstart-stage?/sha2-digest",
  "fstart-stage?/fdt",
]
bundle-h3-bootblock = ["stage", "h3", "armv7", "fstart-stage?/armv7"]
bundle-h3-main = [
  "stage", "h3", "armv7",
  "fstart-stage?/armv7", "fstart-stage?/ffs", "fstart-stage?/ed25519",
  "fstart-stage?/ffs-signature", "fstart-stage?/sha2-digest",
  "fstart-stage?/fdt",
]
bundle-h5-bootblock = [
  "stage", "h3", "aarch64",
  "fstart-stage?/aarch64", "fstart-stage?/aarch64-sunxi-rmr-entry",
]
bundle-h5-main = [
  "stage", "h3", "aarch64",
  "fstart-stage?/aarch64", "fstart-stage?/aarch64-sunxi-rmr-entry",
  "fstart-stage?/ffs", "fstart-stage?/ed25519",
  "fstart-stage?/ffs-signature", "fstart-stage?/sha2-digest",
  "fstart-stage?/fdt",
]
bundle-d1-bootblock = [
  "stage", "d1", "riscv64",
  "fstart-stage?/riscv64", "fstart-stage?/riscv64-sunxi-entry",
]
bundle-d1-main = [
  "stage", "d1", "riscv64",
  "fstart-stage?/riscv64", "fstart-stage?/riscv64-sunxi-entry",
  "fstart-stage?/ffs", "fstart-stage?/ed25519",
  "fstart-stage?/ffs-signature", "fstart-stage?/sha2-digest",
  "fstart-stage?/fdt",
]

[dependencies]
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
fstart-core = { workspace = true }
fstart-driver-sunxi = { workspace = true }
fstart-arch = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, optional = true }
fstart-log = { workspace = true, optional = true }
fstart-stage = { workspace = true, optional = true }
fstart-payload = { workspace = true, optional = true }
serde = { workspace = true }
ufmt = { workspace = true, optional = true }

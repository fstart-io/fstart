[package]
name = "fstart-platform-spacemit"
description = "SpacemiT RISC-V SoC platform flows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
host = ["dep:fstart-core", "dep:fstart-image-build", "dep:serde_json", "fstart-core?/host"]

[dependencies]
fstart-core = { workspace = true, optional = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

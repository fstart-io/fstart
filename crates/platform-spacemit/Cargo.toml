[package]
name = "fstart-platform-spacemit"
description = "SpacemiT RISC-V SoC platform flows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
host = ["dep:fstart-core", "dep:fstart-image-build", "dep:serde_json", "fstart-core?/host"]
stage = [
  "dep:fstart-arch",
  "dep:fstart-driver-uart",
  "dep:fstart-log",
  "dep:fstart-stage",
  "dep:ufmt",
]
riscv64 = ["fstart-arch?/riscv64", "fstart-stage?/riscv64"]
k3 = []
bundle-k3-bootblock = ["stage", "k3", "riscv64"]

[dependencies]
fstart-core = { workspace = true, optional = true }
fstart-arch = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, optional = true }
fstart-image-build = { workspace = true, optional = true }
fstart-log = { workspace = true, optional = true }
fstart-stage = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
ufmt = { workspace = true, optional = true }

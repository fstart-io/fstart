[package]
name = "fstart-stage"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = []
# Platform selection (exactly one must be enabled)
x86_64 = ["dep:fstart-platform-x86_64", "dep:fstart-pio"]
# Driver selection (enabled based on Rust board metadata)
ns16550 = ["dep:fstart-driver-ns16550"]
pci-ecam = ["dep:fstart-driver-pci-ecam", "dep:fstart-alloc"]

# x86 chipset drivers
nsc-pc87382 = ["dep:fstart-driver-nsc-pc87382", "dep:fstart-superio"]
nsc-pc87392 = ["dep:fstart-driver-nsc-pc87392", "dep:fstart-superio"]
intel-gm965 = ["dep:fstart-driver-intel-gm965"]
intel-ich8 = ["dep:fstart-driver-intel-ich8", "dep:fstart-gpio-ich"]
i2c-ck505 = ["dep:fstart-driver-i2c-ck505"]
# NS16550 with x86 port I/O support
ns16550-pio = ["ns16550", "fstart-driver-ns16550?/pio"]
# x86 boot protocol support (zero page construction in platform crate)
x86-boot = []
# x86 MP/SMM support.
mp = ["dep:fstart-mp"]
# Intel x86 CPU drivers (model-specific MSR programming lives in fstart-cpu-intel).
intel-cpu = ["mp", "dep:fstart-cpu-intel"]
cpu-generic-x86 = ["mp"]
cpu-intel-core2 = ["intel-cpu"]
# x86_64: use 1 GiB pages (requires PDPE1GB). Default is 2 MiB pages.
x86-1g-pages = ["fstart-platform-x86_64?/x86-1g-pages"]
# x86_64: build page tables at runtime in writable RAM. Enabled only for
# boards with page_table_addr (QEMU); real XIP boards use ROM tables.
x86-writable-page-tables = ["fstart-platform-x86_64?/x86-writable-page-tables"]
# x86_64: emit static ROM page tables for first-stage real XIP boards.
x86-static-page-tables = ["fstart-platform-x86_64?/x86-static-page-tables"]
# AcpiLoad capability (load ACPI tables from external provider)
acpi-load = []
# MemoryDetect capability (runtime memory detection)
memory-detect = []
# FFS / crypto features (forwarded to fstart-capabilities)
ffs = [
  "dep:fstart-alloc",
  "fstart-capabilities/ffs",
  "dep:fstart-ffs",
  "fstart-platform-x86_64?/early-ffs-anchor",
  "fstart-platform-x86_64?/postcar-stage-load",
]
ed25519 = ["ffs", "fstart-capabilities/ed25519", "fstart-ffs/ed25519"]
sha2-digest = [
  "ffs",
  "fstart-capabilities/sha2-digest",
  "fstart-ffs/sha2-digest",
]
sha3-digest = [
  "ffs",
  "fstart-capabilities/sha3-digest",
  "fstart-ffs/sha3-digest",
]
# LZ4 decompression for compressed stage/payload segments
lz4 = ["ffs", "fstart-capabilities/lz4"]
# FDT preparation for Linux boot (raw blob patcher, no alloc)
fdt = ["fstart-capabilities/fdt"]
# FIT image parsing at runtime
fit = ["ffs", "fstart-capabilities/fit", "dep:fstart-fit"]
# Inter-stage handoff serialization (postcard, for multi-stage boards)
handoff = ["fstart-capabilities/handoff"]
# ACPI table generation — routed through fstart-capabilities which owns
# the prepare() entry point and depends on fstart-acpi internally.
# fstart-acpi is also a direct dep for per-device AcpiDevice trait calls.
acpi = [
  "dep:fstart-alloc",
  "dep:fstart-acpi",
  "fstart-acpi?/x86",
  "fstart-driver-intel-gm965?/acpi",
  "fstart-driver-intel-gm965?/ffs-vbt",
  "fstart-driver-intel-ich8?/acpi",
  "fstart-driver-nsc-pc87382?/acpi",
  "fstart-driver-nsc-pc87392?/acpi",
  "fstart-capabilities/acpi",
]
# SMBIOS table generation — routed through fstart-capabilities which owns
# the prepare() entry point and depends on fstart-smbios internally.
smbios = ["fstart-capabilities/smbios"]
# CrabEFI UEFI payload — links CrabEFI as a library and boots via init_platform().
# Requires alloc (fstart-alloc provides #[global_allocator]).
crabefi = ["dep:fstart-crabefi", "dep:fstart-alloc"]

[dependencies]
# Core firmware infrastructure
fstart-arch = { workspace = true }
fstart-services = { workspace = true }
fstart-capabilities = { workspace = true }
fstart-log = { workspace = true }
ufmt = { workspace = true }
fstart-runtime = { workspace = true }
fstart-types = { workspace = true }
fstart-pio = { workspace = true, optional = true }
heapless = { workspace = true }

# Platform crates (exactly one enabled via feature)
fstart-platform-x86_64 = { workspace = true, optional = true }

# Individual driver crates (enabled via features from Rust board metadata)
fstart-driver-ns16550 = { workspace = true, optional = true }
fstart-driver-pci-ecam = { workspace = true, optional = true }
fstart-superio = { workspace = true, optional = true }
fstart-driver-nsc-pc87382 = { workspace = true, optional = true }
fstart-driver-nsc-pc87392 = { workspace = true, optional = true }
fstart-driver-intel-gm965 = { workspace = true, optional = true }
fstart-driver-intel-ich8 = { workspace = true, optional = true }
fstart-driver-i2c-ck505 = { workspace = true, optional = true }
fstart-mp = { workspace = true, optional = true }
fstart-cpu-intel = { workspace = true, optional = true }
fstart-gpio-ich = { workspace = true, optional = true }

# FFS (optional, behind ffs feature)
fstart-ffs = { workspace = true, optional = true }
fstart-fit = { workspace = true, optional = true }

# ACPI table generation (optional, behind acpi feature)
fstart-acpi = { workspace = true, optional = true }

# Allocator (optional — provides #[global_allocator])
fstart-alloc = { workspace = true, optional = true }

# CrabEFI adapter (optional, behind crabefi feature)
fstart-crabefi = { workspace = true, optional = true }

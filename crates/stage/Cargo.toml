[package]
name = "fstart-stage"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = []
# Platform selection (exactly one must be enabled)
armv7 = ["fstart-arch/armv7"]
aarch64 = ["fstart-arch/aarch64"]
aarch64-el2-relocate-entry = ["fstart-arch/aarch64-el2-relocate-entry"]
aarch64-sunxi-rmr-entry = ["fstart-arch/aarch64-sunxi-rmr-entry"]
riscv64-sunxi-entry = ["fstart-arch/riscv64-sunxi-entry"]
riscv64 = ["fstart-arch/riscv64"]
x86_64 = ["fstart-arch/x86_64"]

# x86_64: use 1 GiB pages (requires PDPE1GB). Default is 2 MiB pages.
x86-1g-pages = ["fstart-arch/x86-1g-pages"]
# x86_64: build page tables at runtime in writable RAM. Enabled only for
# boards with page_table_addr (QEMU); real XIP boards use ROM tables.
x86-writable-page-tables = ["fstart-arch/x86-writable-page-tables"]
# x86_64: emit static ROM page tables for first-stage real XIP boards.
x86-static-page-tables = ["fstart-arch/x86-static-page-tables"]
# FFS / crypto features
bootstrap = ["dep:fstart-crypto", "dep:fstart-ffs", "fstart-crypto/sha2-digest", "fstart-ffs/sha2-digest"]
ffs = ["bootstrap", "fstart-ffs/directory", "fstart-arch/early-ffs-anchor"]
ffs-signature = ["bootstrap", "fstart-ffs/ed25519", "fstart-arch/early-ffs-anchor"]
ed25519 = ["ffs-signature"]
sha2-digest = [
  "bootstrap",
  "fstart-crypto/sha2-digest",
  "fstart-ffs/sha2-digest",
]
sha3-digest = [
  "ffs",
  "fstart-crypto/sha3-digest",
  "fstart-ffs/sha3-digest",
]
# LZ4 decompression for compressed stage/payload segments
lz4 = ["bootstrap"]
# FDT preparation for Linux boot (raw blob patcher, no alloc)
fdt = ["bootstrap"]
# ARM Linux payload selected by fbuild's payload choice.
linux = []
# FIT image parsing at runtime
fit = ["ffs", "dep:fstart-boot", "fstart-boot/fit"]
# Inter-stage handoff serialization (postcard, for multi-stage boards)
handoff = ["dep:postcard"]
# ACPI table generation lives in the selected board/platform crate; fstart-stage
# only provides the allocator needed by ACPI-capable flows.
acpi = []
# SMBIOS-capable fixed flows use the same stage-local allocator.
smbios = []
# CrabEFI UEFI payload — links CrabEFI as a library and boots via init_platform().
# Requires the local stage allocator.
crabefi = ["bootstrap", "dep:fstart-boot", "fstart-arch/riscv64-sbi-resume", "fstart-boot/crabefi"]

[dependencies]
# Core firmware infrastructure
fstart-arch = { workspace = true }
fstart-core = { workspace = true }
fstart-log = { workspace = true }
ufmt = { workspace = true }
heapless = { workspace = true }

# FFS (optional, behind ffs feature)
fstart-ffs = { workspace = true, optional = true }
fstart-crypto = { workspace = true, optional = true }
fstart-boot = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

# CrabEFI adapter lives in fstart-boot behind the crabefi feature.

[package]
name = "fstart-driver-intel"
description = "Intel chipset and support drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Enables the shared GMA display bring-up. Only the mainstage has room for it:
# the postcar image is capped at 64 KiB and must not link the GMA library.
display = []
acpi = [
  "dep:fstart-acpi",
  "dep:fstart-acpi-macros",
]
gm965 = ["fstart-intel-gma/g45"]
i945 = ["ich7", "fstart-intel-gma/i945"]
ich8 = []
pineview = ["ich7", "fstart-intel-gma/i945"]
ich7 = []
spi = ["dep:rflasher-core", "dep:rflasher-internal"]

[dependencies]
sha2 = { workspace = true }
rflasher-core = { workspace = true, optional = true }
rflasher-internal = { workspace = true, optional = true }
bitflags = { workspace = true }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-acpi-macros = { path = "../acpi-macros", optional = true }
fstart-arch = { workspace = true, features = ["x86_64"] }

fstart-driver-superio = { workspace = true }

fstart-intel-gma = { workspace = true }

fstart-log = { workspace = true }
fstart-timestamp = { workspace = true }

fstart-core = { workspace = true, features = ["pci"] }

fstart-pci = { workspace = true }
fstart-smm = { workspace = true }
heapless = { workspace = true }
tock-registers = { workspace = true }
ufmt = { workspace = true }
zerocopy = { workspace = true }

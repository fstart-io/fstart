[package]
name = "fstart-driver-intel"
description = "Intel chipset and support drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = { workspace = true }
fstart-driver-usbdebug = { workspace = true }
rflasher-core = { workspace = true }
fstart-driver-flash-console = { workspace = true }
fstart-driver-spd = { workspace = true }
rflasher-internal = { workspace = true }
bitflags = { workspace = true }
embedded-hal = { workspace = true }
fstart-acpi = { workspace = true, features = ["x86", "pci"] }
fstart-acpi-macros = { path = "../acpi-macros" }
fstart-arch = { workspace = true, features = ["x86_64"] }
fstart-log = { workspace = true }
fstart-options = { workspace = true }
fstart-driver-rtc = { workspace = true }
fstart-timestamp = { workspace = true }

fstart-core = { workspace = true, features = ["pci"] }

fstart-pci = { workspace = true }
fstart-smm = { workspace = true }
heapless = { workspace = true }
tock-registers = { workspace = true }
ufmt = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
fstart-driver-spd = { workspace = true, features = ["testing"] }
fstart-driver-lenovo = { path = "../driver-lenovo", features = ["acpi"] }
tempfile = "3"

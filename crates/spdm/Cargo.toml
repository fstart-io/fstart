[package]
name = "fstart-spdm"
description = "Sans-IO no_std SPDM 1.2 (DSP0274) and Secured Messages (DSP0277)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
p256 = { workspace = true }
# Match p256 0.13 / hmac 0.12 / hkdf 0.12 (digest 0.10).
sha2 = { version = "0.10", default-features = false }
zerocopy = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true

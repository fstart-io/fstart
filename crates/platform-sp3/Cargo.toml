[dependencies]
fstart-driver-spd = { workspace = true, optional = true }
fstart-amdfw-format = { workspace = true }
# The TSC timer and the FCH POST code register; Naples is Zeppelin.
fstart-driver-amd = { workspace = true, features = ["zeppelin"] }
fstart-driver-ipmi = { path = "../driver-ipmi", optional = true }
fstart-core = { workspace = true }
fstart-pci = { workspace = true }
fstart-log = { workspace = true }
fstart-arch = { workspace = true, features = ["x86_64", "x86-identity-paging"] }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-stage = { workspace = true, optional = true }
fstart-driver-tpm = { workspace = true, optional = true }
fstart-tcg = { workspace = true, optional = true }
fstart-smm = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, features = ["pio"] }
tock-registers = { workspace = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
heapless = { workspace = true }
zerocopy = { workspace = true }
ufmt = { workspace = true }

# build.rs lays the SMM image out as the installer will (TSEG fit check).
[build-dependencies]
fstart-smm = { workspace = true }

[dev-dependencies]
# The unit tests cover every generation and the host plan, also in
# `cargo test --workspace`.
fstart-platform-sp3 = { path = ".", features = ["naples", "rome", "milan", "acpi", "host"] }

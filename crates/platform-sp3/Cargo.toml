[package]
name = "fstart-platform-sp3"
description = "AMD SP3 platform (Naples, Rome, Milan): boot flows, memory, MP, SMM, ACPI, image"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

# Generation features are additive: a board enables every generation it
# supports and one reset image serves them all (the CPU picks at runtime).
[features]
default = []
naples = ["fstart-driver-amd/naples"]
rome = ["fstart-driver-amd/rome"]
milan = ["fstart-driver-amd/milan"]
acpi = ["dep:fstart-acpi", "fstart-driver-amd/acpi"]
# The reset-image firmware unit (host::RESET_FEATURE): stage runtime for
# `fstart_entry = "amd-psp-reset"` (asm/reset.S enters the arch crate's
# `_start_ram`); `ffs` brings the stage allocator the arch identity paging
# needs and mounts the FFS the payload comes from, whose root the signature
# features authenticate; the flow builds ACPI. Payloads may be compressed
# by the image builder, so the resident loader needs LZ4 as well.
bundle-reset = [
  "dep:fstart-stage", "fstart-stage/x86_64", "fstart-stage/ffs", "fstart-stage/acpi",
  "fstart-stage/ffs-signature", "fstart-stage/ed25519", "fstart-stage/sha2-digest",
  "fstart-stage/lz4", "acpi", "dep:fstart-driver-spd", "fstart-stage/tcg",
  "dep:fstart-driver-tpm", "dep:fstart-tcg",
]
# Payload backends; fbuild's `fstart_payload` cfg selects the launcher.
payload-linux = ["fstart-stage/linux"]
payload-uefi = ["fstart-stage/crabefi"]
# The FCH SMI handler (`smm::Sp3SmmHandler`) for an SMM image unit; the
# image unit adds `bundle-smm` (handler binding macro, SMM panic handler).
smm = ["dep:fstart-smm", "dep:fstart-driver-ipmi"]
bundle-smm = ["smm", "fstart-smm/stage-bin"]
# Host policy only; never enabled by the emitted firmware unit.
host = ["dep:fstart-image-build", "dep:serde_json"]

# The AMD firmware files of each generation's PSP partition: the two-level
# directories of the vendor images (level 1 the recovery set; the PSP and
# the ABL look a file up in level 2 first). Erased entries are NV areas the
# PSP or the ABL writes. Boards list their APCBs per generation.
[package.metadata.fstart.amd.naples]
bios-directory = "Family17hModel00"
levels = 2
efs-offset = 0x20000
partition-end = 0x600000
apob-destination = 0x30000000


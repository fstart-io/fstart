[package]
name = "fstart-platform-sp3"
description = "AMD SP3 platform (Naples, Rome, Milan): boot flows, memory, MP, SMM, ACPI, image"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

# Generation features are additive: a board enables every generation it
# supports and one reset image serves them all (the CPU picks at runtime).
[features]
default = []
naples = ["fstart-driver-zen/naples"]
rome = ["fstart-driver-zen/rome"]
milan = ["fstart-driver-zen/milan"]
acpi = ["dep:fstart-acpi", "fstart-driver-zen/acpi"]
# The reset-image firmware unit (host::RESET_FEATURE): stage runtime for
# `fstart_entry = "amd-psp-reset"` (asm/reset.S enters the arch crate's
# `_start_ram`); `ffs` brings the stage allocator the arch identity paging
# needs and mounts the FFS the payload comes from, whose root the signature
# features authenticate; the flow builds ACPI.
bundle-reset = [
  "dep:fstart-stage", "fstart-stage/x86_64", "fstart-stage/ffs", "fstart-stage/acpi",
  "fstart-stage/ffs-signature", "fstart-stage/ed25519", "fstart-stage/sha2-digest",
  "acpi",
]
# Payload backends; fbuild's `fstart_payload` cfg selects the launcher.
payload-linux = ["fstart-stage/linux"]
payload-uefi = ["fstart-stage/crabefi"]
# The FCH SMI handler (`smm::Sp3SmmHandler`) for an SMM image unit; the
# image unit adds `bundle-smm` (handler binding macro, SMM panic handler).
smm = ["dep:fstart-smm", "dep:fstart-driver-ipmi", "dep:embedded-hal"]
bundle-smm = ["smm", "fstart-smm/stage-bin"]
# Host policy only; never enabled by the emitted firmware unit.
host = ["dep:fstart-image-build", "dep:serde_json"]

[dependencies]
fstart-driver-zen = { path = "../driver-zen" }
fstart-driver-ipmi = { path = "../driver-ipmi", optional = true }
embedded-hal = { workspace = true, optional = true }
fstart-core = { workspace = true }
fstart-pci = { workspace = true }
fstart-log = { workspace = true }
fstart-arch = { workspace = true, features = ["x86_64", "x86-identity-paging"] }
fstart-acpi = { workspace = true, features = ["x86"], optional = true }
fstart-stage = { workspace = true, optional = true }
fstart-smm = { workspace = true, optional = true }
fstart-driver-uart = { workspace = true, features = ["pio"] }
tock-registers = { workspace = true }
fstart-image-build = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
heapless = { workspace = true }
zerocopy = { workspace = true }
ufmt = { workspace = true }

# build.rs lays the SMM image out as the installer will (TSEG fit check).
[build-dependencies]
fstart-smm = { workspace = true }

[package]
name = "fstart-boot"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
fit = ["dep:dtoolkit", "dep:heapless"]
# Capabilities are additive: UI includes the full core, and combining full and
# basic still selects the full runtime bundle.
crabefi = ["crabefi-basic", "crabefi/full"]
crabefi-ui = ["crabefi", "crabefi/ui"]
crabefi-elan-i2c = ["crabefi-basic", "crabefi/elan-i2c"]
crabefi-hid-i2c = ["crabefi-basic", "crabefi/hid-i2c"]
crabefi-basic = ["dep:crabefi", "dep:fstart-arch", "dep:fstart-core", "dep:fstart-log"]
std = ["fit", "fstart-crypto?/all"]
sha2-digest = ["fit", "fstart-crypto/sha2-digest"]
sha3-digest = ["fit", "fstart-crypto?/sha3-digest"]

[dependencies]
fstart-core = { workspace = true, optional = true }
fstart-crypto = { workspace = true, optional = true }
fstart-log = { workspace = true, optional = true }
dtoolkit = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
# Upstream split into a workspace; package `crabefi-core` keeps lib name `crabefi`.
crabefi = { package = "crabefi-core", git = "https://github.com/ArthurHeymans/CrabEFI.git", rev = "b2ef47afc94c038ef8ccd890d853d0312365320b", default-features = false, features = ["bundled-runtime-image", "variable-store"], optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
fstart-arch = { workspace = true, features = ["x86_64"], optional = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
fstart-arch = { workspace = true, features = ["riscv64"], optional = true }

[dev-dependencies]
dtoolkit = { workspace = true, features = ["write"] }

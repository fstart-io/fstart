[package]
name = "fstart-arch"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
armv7 = []
armv5te = []
# The platform supplies fstart_pre_stack_entry (e.g. to preserve boot-ROM state).
platform-pre-stack = ["armv7"]
aarch64 = []
aarch64-el2-relocate-entry = []
# The platform supplies its own reset entry instead of the generic one.
platform-entry = []
riscv64 = []
riscv64-sbi-resume = []
x86_64 = ["dep:fstart-smm"]
# The SMM handler image: call-free POST-port delays instead of the TSC
# calibration, which the handler cannot afford.
smm-handler = []
# The shared AMD PSP-copied reset entry's AP route and BIST (`x86::psp_reset`);
# the platform includes `asm/amd_psp_reset.S`.
amd-psp-reset = ["x86_64"]
# Stages with a heap: `paging::IdentityTables::build` takes its frames from it.
alloc = []
# Identity page tables built in Rust (`boot::paging`).
x86-identity-paging = ["x86_64", "dep:x86_64_crate"]
# Raw COM1 transition checkpoints for physical postcar bring-up only.
x86-postcar-uart-debug = []
early-ffs-anchor = []
# MSR models for the tests of dependent crates.
testing = []

[dependencies]
fstart-log = { workspace = true }
heapless = { workspace = true }
fstart-smm = { workspace = true, optional = true }
fstart-core = { workspace = true }
embedded-hal = { workspace = true }
ufmt = { workspace = true }
tock-registers = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
x86 = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64_crate = { workspace = true, optional = true }

[build-dependencies]
object = { workspace = true }

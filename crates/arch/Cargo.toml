[package]
name = "fstart-arch"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
armv7 = []
sunxi-fel = ["armv7"]
aarch64 = []
aarch64-el2-relocate-entry = []
aarch64-sunxi-rmr-entry = []
riscv64 = []
riscv64-sunxi-entry = []
riscv64-sbi-resume = []
x86_64 = ["dep:fstart-smm"]
# The SMM handler image: call-free POST-port delays instead of the TSC
# calibration, which the handler cannot afford.
smm-handler = []
# Heap-built identity page tables for payload handoff (needs `alloc`).
x86-identity-paging = ["x86_64", "dep:x86_64_crate"]
x86-1g-pages = []
x86-writable-page-tables = []
x86-static-page-tables = []
# Raw COM1 transition checkpoints for physical postcar bring-up only.
x86-postcar-uart-debug = []
early-ffs-anchor = []
# MSR models for the tests of dependent crates.
testing = []

[dependencies]
fstart-log = { workspace = true }
heapless = { workspace = true }
fstart-smm = { workspace = true, optional = true }
fstart-core = { workspace = true }
embedded-hal = { workspace = true }
ufmt = { workspace = true }
tock-registers = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
x86 = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64_crate = { workspace = true, optional = true }

[build-dependencies]
object = { workspace = true }

[alias]
fbuild = "run --package fbuild --"

# -Zbuild-std of core for x86_64-unknown-none trips the `sse` target-feature
# future-incompat lint inside core itself (rust-lang/rust#117938) on every
# x86 stage. Nothing in this tree can act on that report.
[future-incompat-report]
frequency = "never"

# X201 bring-up: pinned CrabEFI checkout with active-EHCI-debug preservation.
# Replace with an upstream revision once the fix is published.
[patch."https://github.com/ArthurHeymans/CrabEFI.git"]
crabefi-core = { path = "../CrabEFI-x201-debug/crabefi-core" }

[workspace]
resolver = "2"
members = [
  "tools/fbuild",
  "crates/core",
  "crates/platform-intel",
  "crates/platform-sunxi",
  "crates/platform-qemu",
  "crates/ffs",
  "crates/image-build",
  "crates/crypto",
  "crates/arch",
  "crates/log",
  "crates/driver-uart",
  "crates/driver-intel",
  "crates/driver-sunxi",
  "crates/driver-superio",
  "crates/pci",
  "crates/stage",
  "crates/acpi",
  "crates/acpi-macros",
  "crates/smm",
  "crates/boot",
]
exclude = ["attic", "boards/bananapi-m1", "boards/lenovo-x61", "boards/foxconn-d41s", "boards/qemu-q35", "boards/qemu-riscv64", "boards/qemu-sifive-u", "boards/qemu-aarch64", "boards/qemu-armv7", "boards/sifive-unmatched", "boards/orangepi-r1", "boards/orangepi-pc2", "boards/licheerv-dock", "boards/qemu-sbsa"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }

# Crypto (RustCrypto)
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
sha3 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# Embedded / no_std utilities
embedded-hal = { version = "1", default-features = false }
heapless = { version = "0.8", default-features = false, features = ["serde"] }
konst = { version = "0.4", default-features = false, features = ["iter"] }
ufmt = { version = "0.2", default-features = false }
bitflags = "2"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
tock-registers = "0.10"
pci_types = "0.10.1"
x86 = { version = "0.52", default-features = false }

# Device tree
dtoolkit = { version = "0.1", default-features = false }

# Compression
lz4_flex = { version = "0.11", default-features = false }

# Object/ELF parsing and flat-binary extraction (host-side only)
object = { version = "0.37", default-features = false, features = [
  "elf",
  "read",
] }

# fbuild / host-side
clap = { version = "4", features = ["derive"] }

# Internal workspace crates
fstart-core = { path = "crates/core" }
fstart-platform-intel = { path = "crates/platform-intel" }
fstart-platform-sunxi = { path = "crates/platform-sunxi" }
fstart-platform-qemu = { path = "crates/platform-qemu" }
fstart-pci = { path = "crates/pci" }
fstart-ffs = { path = "crates/ffs" }
fstart-crypto = { path = "crates/crypto" }
fstart-log = { path = "crates/log" }
fstart-arch = { path = "crates/arch" }
fstart-driver-intel = { path = "crates/driver-intel" }
fstart-driver-sunxi = { path = "crates/driver-sunxi" }
fstart-driver-superio = { path = "crates/driver-superio" }
fstart-driver-uart = { path = "crates/driver-uart" }
fstart-stage = { path = "crates/stage" }
fstart-acpi = { path = "crates/acpi" }
fstart-smm = { path = "crates/smm" }
fstart-image-build = { path = "crates/image-build" }
fstart-boot = { path = "crates/boot" }

[profile.dev]
panic = "abort"
# Optimise fstart-stage for size even in dev builds.  SRAM/CAR-constrained
# bootblocks overflow at opt-level 0; "s" keeps debug info while fitting.
[profile.dev.package.fstart-stage]
opt-level = "s"

# Crypto crates are unusably slow at opt-level 0 (minutes for a single
# Ed25519 verify on emulated RISC-V).  Always compile them with optimizations.
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.p256]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
#strip = "symbols"

# Crypto crates need speed-optimized codegen even in size-optimized release
# builds.  opt-level "s"/"z" can be orders of magnitude slower for scalar
# multiplication on soft-float targets (emulated RISC-V, etc.).
[profile.release.package.ed25519-dalek]
opt-level = 2
[profile.release.package.curve25519-dalek]
opt-level = 2
[profile.release.package.sha2]
opt-level = 2
[profile.release.package.sha3]
opt-level = 2
[profile.release.package.p256]
opt-level = 2

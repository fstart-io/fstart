[workspace]
resolver = "2"
members = [
  "xtask",
  "crates/fstart-core",
  "crates/fstart-platform-intel-gm965-ich8",
  "crates/fstart-ffs",
  "crates/fstart-crypto",
  "crates/fstart-arch",
  "crates/fstart-capabilities",
  "crates/fstart-alloc",
  "crates/fstart-log",
  "crates/fstart-runtime",
  "crates/fstart-driver-uart",
  "crates/fstart-driver-intel",
  "crates/fstart-driver-superio",
  "crates/fstart-pci",
  "crates/fstart-stage",
  "crates/fstart-acpi",
  "crates/fstart-acpi-macros",
  "crates/fstart-smbios",
  "crates/fstart-platform-x86_64",
  "crates/fstart-spd",
  "crates/fstart-hda",
  "crates/fstart-smm",
  "crates/fstart-smm-runtime",
  "crates/fstart-smm-stage",
  "crates/fstart-crabefi",
]
exclude = ["attic", "boards/lenovo-x61"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }

# Crypto (RustCrypto)
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
sha3 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# Embedded / no_std utilities
embedded-hal = { version = "1", default-features = false }
heapless = { version = "0.8", default-features = false, features = ["serde"] }
konst = { version = "0.4", default-features = false, features = ["iter"] }
ufmt = { version = "0.2", default-features = false }
bitflags = "2"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
tock-registers = "0.10"
x86 = { version = "0.52", default-features = false }

# Device tree
dtoolkit = { version = "0.1", default-features = false }

# Compression
lz4_flex = { version = "0.11", default-features = false }

# Object/ELF parsing and flat-binary extraction (host-side only)
object = { version = "0.37", default-features = false, features = [
  "elf",
  "read",
] }

# xtask / host-side
clap = { version = "4", features = ["derive"] }

# Internal workspace crates
fstart-core = { path = "crates/fstart-core" }
fstart-platform-intel-gm965-ich8 = { path = "crates/fstart-platform-intel-gm965-ich8" }
fstart-pci = { path = "crates/fstart-pci" }
fstart-ffs = { path = "crates/fstart-ffs" }
fstart-crypto = { path = "crates/fstart-crypto" }
fstart-capabilities = { path = "crates/fstart-capabilities" }
fstart-alloc = { path = "crates/fstart-alloc" }
fstart-log = { path = "crates/fstart-log" }
fstart-runtime = { path = "crates/fstart-runtime" }
fstart-arch = { path = "crates/fstart-arch" }
fstart-driver-intel = { path = "crates/fstart-driver-intel" }
fstart-driver-superio = { path = "crates/fstart-driver-superio" }
fstart-driver-uart = { path = "crates/fstart-driver-uart" }
fstart-crabefi = { path = "crates/fstart-crabefi" }
fstart-stage = { path = "crates/fstart-stage" }
fstart-fit = { path = "crates/fstart-fit" }
fstart-acpi = { path = "crates/fstart-acpi" }
fstart-smbios = { path = "crates/fstart-smbios" }
fstart-platform-x86_64 = { path = "crates/fstart-platform-x86_64" }
fstart-spd = { path = "crates/fstart-spd" }
fstart-hda = { path = "crates/fstart-hda" }
fstart-smm = { path = "crates/fstart-smm" }
fstart-smm-runtime = { path = "crates/fstart-smm-runtime" }
fstart-smm-stage = { path = "crates/fstart-smm-stage" }
fstart-smm-image = { path = "crates/fstart-smm-image" }

[profile.dev]
panic = "abort"
# Optimise fstart-stage for size even in dev builds.  SRAM/CAR-constrained
# bootblocks overflow at opt-level 0; "s" keeps debug info while fitting.
[profile.dev.package.fstart-stage]
opt-level = "s"

# Crypto crates are unusably slow at opt-level 0 (minutes for a single
# Ed25519 verify on emulated RISC-V).  Always compile them with optimizations.
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.p256]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
#strip = "symbols"

# Crypto crates need speed-optimized codegen even in size-optimized release
# builds.  opt-level "s"/"z" can be orders of magnitude slower for scalar
# multiplication on soft-float targets (emulated RISC-V, etc.).
[profile.release.package.ed25519-dalek]
opt-level = 2
[profile.release.package.curve25519-dalek]
opt-level = 2
[profile.release.package.sha2]
opt-level = 2
[profile.release.package.sha3]
opt-level = 2
[profile.release.package.p256]
opt-level = 2

[workspace]
resolver = "3"
# Default commands exercise host libraries and tools. Firmware units are
# selected individually by fbuild with their target, features and artifacts.
default-members = ["tools/fbuild", "tools/amdfw", "tools/ffmt", "crates/*"]
members = [
  "boards/*/*",
  "crates/*",
  "tools/fbuild",
  "tools/amdfw",
  "tools/image-web",
  "tools/release",
  "tools/ffmt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# Serialization
serde = { version = "1", default-features = false, features = ["derive"] }

# Crypto (RustCrypto)
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }
sha3 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
ed25519-dalek = { version = "2", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# Embedded / no_std utilities
embedded-hal = { version = "1", default-features = false }
embedded-io = { version = "0.6", default-features = false }
embedded-storage = { version = "0.3", default-features = false }
heapless = { version = "0.8", default-features = false, features = ["portable-atomic"] }
linked_list_allocator = { version = "0.10.6", default-features = false }
konst = { version = "0.4", default-features = false, features = ["iter"] }
ufmt = { version = "0.2", default-features = false }
bitflags = "2"
portable-atomic = "1"
# The lock's atomics come from portable-atomic: not every target has CAS.
spin = { version = "0.12", default-features = false, features = ["spin_mutex", "portable-atomic"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
tock-registers = "0.10"
pci_types = "0.10.1"
x86 = { version = "0.52", default-features = false }
x86_64_crate = { package = "x86_64", version = "0.15", default-features = false }
zeroize = { version = "1", default-features = false }

# Firmware SPI controllers; use the allocation-free host/controller interface.
rflasher-core = { git = "https://github.com/ArthurHeymans/rflasher.git", rev = "a37c758fd373b4c23d631c20b78a64c1210205c3", default-features = false }
rflasher-internal = { git = "https://github.com/ArthurHeymans/rflasher.git", rev = "a37c758fd373b4c23d631c20b78a64c1210205c3", default-features = false }

# ASPEED register access, generated from kyanitecomputer/aspeed-data.
aspeed-pac = { git = "https://github.com/kyanitecomputer/aspeed-data", rev = "e2834759833ae2247ed0c7647460fd4507389ad3", default-features = false }
# Blocking ASPEED driver cores; pins the same aspeed-data revision.
aspeed-hal = { git = "https://github.com/kyanitecomputer/aspeed-rs", rev = "584969669dfa6d5820a346f771bc7f70f5d322ac", default-features = false }

# CrabEFI's EFI types and X.509 parsing, for host tools; the same revision
# as crabefi-core in crates/boot.
crabefi-efi-types = { git = "https://github.com/ArthurHeymans/CrabEFI.git", rev = "c6682553189cfb30e451b90351fae01fe7140433" }
crabefi-pkcs7 = { git = "https://github.com/ArthurHeymans/CrabEFI.git", rev = "c6682553189cfb30e451b90351fae01fe7140433" }

# Device tree
dtoolkit = { version = "0.1", default-features = false }

# Compression
lz4_flex = { version = "0.14", default-features = false }
lzma-rust2 = { version = "0.24", default-features = false }

# Object/ELF parsing and flat-binary extraction (host-side only)
object = { version = "0.37", default-features = false, features = [
  "elf",
  "read",
] }

# fbuild / host-side
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder"] }
clap = { version = "4", features = ["derive", "env"] }

# Internal workspace crates
fstart-acpi = { path = "crates/acpi" }
fstart-acpi-macros = { path = "crates/acpi-macros" }
fstart-amdfw-format = { path = "crates/amdfw-format" }
fstart-arch = { path = "crates/arch" }
fstart-boot = { path = "crates/boot" }
fstart-core = { path = "crates/core" }
fstart-coreboot = { path = "crates/coreboot" }
fstart-crypto = { path = "crates/crypto" }
fstart-driver-amd = { path = "crates/driver-amd" }
fstart-driver-aspeed = { path = "crates/driver-aspeed" }
fstart-driver-chromeec = { path = "crates/driver-chromeec" }
fstart-driver-flash-console = { path = "crates/driver-flash-console" }
fstart-driver-i2c = { path = "crates/driver-i2c" }
fstart-driver-intel = { path = "crates/driver-intel" }
fstart-driver-ipmi = { path = "crates/driver-ipmi" }
fstart-driver-lenovo = { path = "crates/driver-lenovo" }
fstart-driver-redriver = { path = "crates/driver-redriver" }
fstart-driver-ricoh = { path = "crates/driver-ricoh" }
fstart-driver-rtc = { path = "crates/driver-rtc" }
fstart-driver-sifive = { path = "crates/driver-sifive" }
fstart-driver-spd = { path = "crates/driver-spd" }
fstart-driver-sunxi = { path = "crates/driver-sunxi" }
fstart-driver-superio = { path = "crates/driver-superio" }
fstart-driver-tpm = { path = "crates/driver-tpm" }
fstart-driver-uart = { path = "crates/driver-uart" }
fstart-driver-usbdebug = { path = "crates/driver-usbdebug" }
fstart-driver-vbios = { path = "crates/driver-vbios" }
fstart-fdt = { path = "crates/fdt" }
fstart-ffs = { path = "crates/ffs" }
fstart-image-build = { path = "crates/image-build" }
fstart-load = { path = "crates/load" }
fstart-log = { path = "crates/log" }
fstart-memtest = { path = "crates/memtest" }
fstart-options = { path = "crates/options" }
fstart-payload = { path = "crates/payload" }
fstart-pci = { path = "crates/pci" }
fstart-platform-amd = { path = "crates/platform-amd" }
fstart-platform-aspeed = { path = "crates/platform-aspeed" }
fstart-platform-intel = { path = "crates/platform-intel" }
fstart-platform-qemu = { path = "crates/platform-qemu" }
fstart-platform-sifive = { path = "crates/platform-sifive" }
fstart-platform-sunxi = { path = "crates/platform-sunxi" }
fstart-resume = { path = "crates/resume" }
fstart-smm = { path = "crates/smm" }
fstart-stage = { path = "crates/stage" }
fstart-store = { path = "crates/store" }
fstart-tcg = { path = "crates/tcg" }
fstart-timestamp = { path = "crates/timestamp" }

[profile.dev]
panic = "abort"
# Firmware dev builds are size-optimized all the same: fbuild sets
# opt-level "s" for every crate it builds into a stage (selection.rs), as
# opt-level 0 frames overflow the 8 KiB CAR/SRAM boot stacks. Host tools
# and tests stay unoptimized.
[profile.dev.package.lz4_flex]
opt-level = 2

# Crypto crates are unusably slow at opt-level 0 (minutes for a single
# Ed25519 verify on emulated RISC-V).  Always compile them with optimizations.
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.sha1]
opt-level = 2
[profile.dev.package.p256]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
#strip = "symbols"

# Crypto crates need speed-optimized codegen even in size-optimized release
# builds.  opt-level "s"/"z" can be orders of magnitude slower for scalar
# multiplication on soft-float targets (emulated RISC-V, etc.).
[profile.release.package.ed25519-dalek]
opt-level = 2
[profile.release.package.curve25519-dalek]
opt-level = 2
[profile.release.package.sha2]
opt-level = 2
[profile.release.package.sha3]
opt-level = 2
[profile.release.package.sha1]
opt-level = 2
[profile.release.package.p256]
opt-level = 2

# lz4_flex hashes differently on 32-bit targets, so the web assembler
# (wasm32) compressed stages differently from fbuild. Until
# https://github.com/PSeitz/lz4_flex/pull/250 is released.
[patch.crates-io]
lz4_flex = { git = "https://github.com/ArthurHeymans/lz4_flex", rev = "9a95e8549488bb929e29561f13666c1b33545551" }

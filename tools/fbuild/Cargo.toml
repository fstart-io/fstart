[package]
name = "fbuild"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true }
object = { workspace = true }
fstart-core = { workspace = true }
fstart-image-build = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std", "display"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
fstart-platform-qemu = { workspace = true, features = ["host"] }
object = { workspace = true, features = ["write_std"] }

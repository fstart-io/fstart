[package]
name = "fbuild"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true }
base64ct = { version = "1.8", features = ["alloc"] }
byteorder = "1.5"
fstart-crypto = { workspace = true, features = ["pcr-banks"] }
object = { workspace = true }
fstart-core = { workspace = true, features = ["host"] }
fstart-image-build = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.27"
fstart-platform-qemu = { workspace = true, features = ["host"] }
object = { workspace = true, features = ["write_std"] }
